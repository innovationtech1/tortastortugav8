<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Compartir ubicacion - Tortas Tortuga</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: linear-gradient(160deg,#1a1a1a,#0d0d0d);
    color:#fff; font-family:system-ui,-apple-system,sans-serif;
    min-height:100vh; min-height:100dvh;
    display:flex; align-items:center; justify-content:center; padding:1.5rem;
  }
  .card {
    background:#1e1e1e; border-radius:24px; padding:2rem 1.5rem;
    max-width:420px; width:100%; text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,.5);
  }
  .logo { font-size:3rem; margin-bottom:.5rem; }
  h1 { font-size:1.4rem; color:#FF5A00; margin-bottom:.5rem; }
  .sub { color:#aaa; font-size:.95rem; line-height:1.5; margin-bottom:1.5rem; }
  .pedido-info {
    background:rgba(255,90,0,.08); border-radius:12px; padding:.8rem;
    margin-bottom:1.5rem; font-size:.85rem; color:#FF5A00;
  }
  button {
    width:100%; padding:1.1rem; border:none; border-radius:16px;
    font-family:inherit; font-size:1.05rem; font-weight:800; cursor:pointer;
    display:flex; align-items:center; justify-content:center; gap:.5rem;
  }
  .btn-share {
    background:linear-gradient(135deg,#25D366,#1DB954); color:#fff;
    box-shadow:0 6px 20px rgba(37,211,102,.35);
  }
  .btn-share:active { transform:scale(.98); }
  .status { margin-top:1.2rem; font-size:.9rem; min-height:1.5rem; line-height:1.5; }
  .spinner {
    display:inline-block; width:18px; height:18px; border:2.5px solid rgba(255,255,255,.3);
    border-top-color:#fff; border-radius:50%; animation:spin .8s linear infinite;
  }
  @keyframes spin { to { transform:rotate(360deg); } }
  .exito { color:#25D366; }
  .error { color:#F44336; }
  .mapa {
    margin-top:1rem; border-radius:12px; overflow:hidden; display:none;
    border:1px solid rgba(255,255,255,.1);
  }
  .mapa iframe { width:100%; height:180px; border:0; display:block; }
  .privacidad { margin-top:1.2rem; font-size:.72rem; color:#666; line-height:1.5; }
</style>

<style id="ios-compat">
/* ── Compatibilidad iOS / Safari ── */
/* Evitar zoom automático al enfocar inputs (iOS hace zoom si font-size < 16px) */
@supports (-webkit-touch-callout: none) {
  input, select, textarea { font-size: 16px !important; }
}
/* Respetar el notch y áreas seguras del iPhone */
body { padding-left: env(safe-area-inset-left); padding-right: env(safe-area-inset-right); }
/* Momentum scroll suave en iOS */
* { -webkit-overflow-scrolling: touch; }
/* Evitar resaltado azul al tocar botones en iOS */
button, a, .btn-primary, .hbtn, .mp-btn { -webkit-tap-highlight-color: transparent; }
/* Evitar que iOS ajuste el tamaño del texto al rotar */
html { -webkit-text-size-adjust: 100%; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">🐢</div>
    <h1>Tortas Tortuga</h1>
    <p class="sub">Comparte tu ubicacion para que podamos entregarte tu pedido a domicilio.</p>

    <div class="pedido-info" id="pedido-info">Cargando pedido...</div>

    <button class="btn-share" id="btn-share" onclick="compartirUbicacion()">
      <span>📍</span> Compartir mi ubicacion
    </button>

    <div class="status" id="status"></div>

    <div class="mapa" id="mapa"></div>

    <!-- Referencia opcional para el repartidor -->
    <div id="ref-section" style="display:none;margin-top:1.2rem;text-align:left;">
      <label style="font-size:.8rem;color:#aaa;display:block;margin-bottom:.4rem;">
        Alguna referencia? (opcional)
      </label>
      <input id="referencia" type="text" placeholder="Ej: casa azul, porton negro, apto 3"
        style="width:100%;box-sizing:border-box;padding:.7rem;background:#0d0d0d;border:1.5px solid rgba(255,255,255,.15);color:#fff;border-radius:10px;font-family:inherit;font-size:.9rem;outline:none;">
      <button onclick="guardarReferencia()" id="btn-ref"
        style="margin-top:.6rem;padding:.7rem;background:rgba(255,90,0,.15);border:1.5px solid rgba(255,90,0,.4);color:#FF5A00;border-radius:10px;font-family:inherit;font-size:.85rem;font-weight:700;cursor:pointer;width:100%;">
        Guardar referencia
      </button>
    </div>

    <p class="privacidad">
      Tu ubicacion solo se usa para entregar este pedido. No se comparte con terceros.
    </p>

    <button onclick="regresarAMiPedido()"
      style="margin-top:1.2rem;padding:.8rem;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);color:#ccc;border-radius:12px;font-family:inherit;font-size:.9rem;font-weight:700;cursor:pointer;width:100%;">
      &larr; Regresar a mi pedido
    </button>
  </div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getFirestore, doc, updateDoc, getDoc, collection, getDocs, onSnapshot } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const app = initializeApp({
  apiKey: "AIzaSyAQPpVvqUJ_F8-zZiCNfg77vFbu5UKPz5k",
  authDomain: "tortas-tortuga.firebaseapp.com",
  projectId: "tortas-tortuga",
  storageBucket: "tortas-tortuga.firebasestorage.app",
  messagingSenderId: "586554873297",
  appId: "1:586554873297:web:c0e0e2fbe1a29b0b3ed83e"
});
const db = getFirestore(app);

// Leer el id del pedido de la URL: ?pedido=XXXX
const params = new URLSearchParams(window.location.search);
const pedidoId = params.get('pedido');

const infoEl = document.getElementById('pedido-info');
const statusEl = document.getElementById('status');
const btnEl = document.getElementById('btn-share');

if (!pedidoId) {
    infoEl.textContent = 'Link invalido. Pide al restaurante un nuevo enlace.';
    btnEl.style.display = 'none';
} else {
    // Cargar info del pedido
    (async function() {
        try {
            const snap = await getDoc(doc(db, 'pedidos', pedidoId));
            if (snap.exists()) {
                const p = snap.data();
                infoEl.textContent = 'Pedido ' + (p.folioStr || '') + (p.cliente ? ' - ' + p.cliente : '');
                if (p.ubicacionCliente) {
                    statusEl.innerHTML = '<span class="exito">Ya compartiste tu ubicacion. Gracias!</span>';
                }
            } else {
                infoEl.textContent = 'Pedido no encontrado.';
            }
        } catch(e) {
            infoEl.textContent = 'Pedido a domicilio';
        }
    })();
}

window.regresarAMiPedido = function() {
    // Volver a la vista del cliente. Si venimos desde ahi (misma app),
    // history.back es lo mas fluido; si no, ir directo a mi-pedido.
    if (document.referrer && document.referrer.indexOf('mi-pedido') >= 0) {
        history.back();
    } else {
        window.location.href = 'pages/mi-pedido.html';
    }
};

window.guardarReferencia = async function() {
    if (!pedidoId) return;
    var ref = (document.getElementById('referencia').value || '').trim();
    if (!ref) return;
    var btn = document.getElementById('btn-ref');
    btn.textContent = 'Guardando...';
    try {
        await updateDoc(doc(db, 'pedidos', pedidoId), { referenciaCliente: ref });
        btn.textContent = 'Referencia guardada';
        btn.style.background = 'rgba(37,211,102,.15)';
        btn.style.borderColor = '#25D366';
        btn.style.color = '#25D366';
    } catch(e) {
        btn.textContent = 'Error, reintenta';
    }
};


// ── DISTANCIA A LA TORTUMÓVIL MÁS CERCANA (lado cliente) ──
function _distanciaMillasCli(lat1, lng1, lat2, lng2) {
    const R = 3958.8;
    const dLat = (lat2-lat1) * Math.PI/180;
    const dLng = (lng2-lng1) * Math.PI/180;
    const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

let _distWatchCli = null;
function iniciarDistanciaCliente(cliLat, cliLng) {
    // Crear el elemento de distancia si no existe
    let distEl = document.getElementById('dist-tortumovil');
    if (!distEl) {
        distEl = document.createElement('div');
        distEl.id = 'dist-tortumovil';
        distEl.style.cssText = 'margin-top:1rem;padding:1rem;border-radius:14px;' +
            'background:linear-gradient(160deg,rgba(255,90,0,.15),rgba(255,90,0,.05));' +
            'border:1px solid rgba(255,90,0,.3);text-align:center;';
        distEl.innerHTML = '<div style="color:#aaa;font-size:.8rem;">Buscando la tortumóvil más cercana…</div>';
        statusEl.parentNode.insertBefore(distEl, statusEl.nextSibling);
    }

    // Escuchar la colección de ubicaciones en vivo
    if (_distWatchCli) _distWatchCli();
    _distWatchCli = onSnapshot(collection(db, 'ubicaciones'), function(snap) {
        let masCerca = null, minDist = Infinity;
        snap.forEach(function(d) {
            const u = d.data();
            if (u.lat && u.lng) {
                const dist = _distanciaMillasCli(cliLat, cliLng, u.lat, u.lng);
                if (dist < minDist) { minDist = dist; masCerca = u; }
            }
        });
        if (masCerca) {
            const millas = minDist.toFixed(1);
            const nombre = masCerca.nombre || 'Tortumóvil';
            distEl.innerHTML =
                '<div style="font-size:.75rem;color:#aaa;margin-bottom:.3rem;">🛵 ' + nombre + '</div>' +
                '<div style="font-size:1.6rem;font-weight:900;color:#FF7A33;">' + millas + ' millas</div>' +
                '<div style="font-size:.75rem;color:#aaa;margin-top:.2rem;">de distancia de ti</div>';
        } else {
            distEl.innerHTML = '<div style="color:#aaa;font-size:.8rem;">La tortumóvil aún no comparte su ubicación.</div>';
        }
    });
}

window.compartirUbicacion = function() {
    if (!pedidoId) return;
    if (!navigator.geolocation) {
        statusEl.innerHTML = '<span class="error">Tu navegador no soporta ubicacion.</span>';
        return;
    }

    statusEl.innerHTML = '<span class="spinner"></span> Obteniendo tu ubicacion...';
    btnEl.disabled = true;

    navigator.geolocation.getCurrentPosition(
        async function(pos) {
            const lat = pos.coords.latitude;
            const lng = pos.coords.longitude;
            const precision = Math.round(pos.coords.accuracy);

            try {
                // Guardar ubicación + foto de referencia + cargo de $5 del tortumóvil
                var _fotoRef = (window._fotoRefData || localStorage.getItem('tt_foto_ref_ubi') || null);
                var _updateData = {
                    ubicacionCliente: {
                        lat: lat,
                        lng: lng,
                        precision: precision,
                        compartidaEn: new Date().toISOString(),
                    },
                    cargoServicio: 5,          // $5 por envío de tortumóvil
                    ubicacionCompartida: true
                };
                if (_fotoRef) _updateData.fotoReferencia = _fotoRef;
                await updateDoc(doc(db, 'pedidos', pedidoId), _updateData);
                try { localStorage.removeItem('tt_foto_ref_ubi'); } catch(e){}

                statusEl.innerHTML = '<span class="exito">Ubicacion enviada! El repartidor ya puede verte. Gracias!</span>';

                // Calcular distancia a la tortumovil mas cercana y mostrarla al cliente (en vivo)
                iniciarDistanciaCliente(lat, lng);

                // Mostrar mini mapa de confirmacion
                const mapa = document.getElementById('mapa');
                mapa.innerHTML = '<iframe src="https://maps.google.com/maps?q=' + lat + ',' + lng + '&z=16&output=embed"></iframe>';
                mapa.style.display = 'block';

                btnEl.innerHTML = '<span>\u2705</span> Ubicacion compartida';

                // Mostrar campo de referencia opcional
                var refSec = document.getElementById('ref-section');
                if (refSec) refSec.style.display = 'block';
            } catch(e) {
                statusEl.innerHTML = '<span class="error">Error al enviar: ' + e.message + '. Intenta de nuevo.</span>';
                btnEl.disabled = false;
            }
        },
        function(err) {
            var msg = 'No pudimos obtener tu ubicacion.';
            if (err.code === 1) msg = 'Debes permitir el acceso a tu ubicacion. Toca el candado en la barra y activa Ubicacion.';
            else if (err.code === 2) msg = 'Ubicacion no disponible. Activa el GPS de tu telefono.';
            else if (err.code === 3) msg = 'Tardo demasiado. Intenta de nuevo.';
            statusEl.innerHTML = '<span class="error">' + msg + '</span>';
            btnEl.disabled = false;
        },
        { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
    );
};
</script>
</body>
</html>
