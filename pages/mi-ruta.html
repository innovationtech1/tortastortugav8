<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<style>
  :root { --primary:#FF5A00; --bg:#0E0E0E; --surface:#1C1C1C; --muted:#888; }
  * { box-sizing:border-box; }
  body { background:var(--bg); color:#fff; font-family:'Poppins',system-ui,sans-serif; margin:0; }
  .ruta-header {
    background:linear-gradient(135deg,#FF5A00,#FF8C00); padding:1.1rem 1rem;
    display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:10;
  }
  .ruta-header h1 { font-size:1.15rem; font-weight:900; margin:0; display:flex; align-items:center; gap:.5rem; }
  .ruta-header .rep-nombre { font-size:.78rem; opacity:.92; font-weight:600; }
  .ruta-cont { max-width:640px; margin:0 auto; padding:1rem; }
  .resumen-ruta {
    display:flex; gap:.6rem; margin-bottom:1rem;
  }
  .resumen-item {
    flex:1; background:var(--surface); border:1px solid rgba(255,255,255,.08);
    border-radius:12px; padding:.7rem; text-align:center;
  }
  .resumen-item .n { font-size:1.4rem; font-weight:900; color:var(--primary); }
  .resumen-item .l { font-size:.68rem; color:var(--muted); }
  .pedido-card {
    background:linear-gradient(160deg,#1c1c1c,#161616);
    border:1px solid rgba(255,255,255,.09);
    border-left:4px solid #FF5A00;
    border-radius:16px; padding:1.1rem; margin-bottom:1rem;
    box-shadow:0 4px 16px rgba(0,0,0,.3);
    transition:transform .25s ease, box-shadow .25s ease;
  }
  .pedido-card:hover {
    transform:translateY(-2px);
    box-shadow:0 8px 24px rgba(0,0,0,.4);
  }
  .pedido-card.entregado {
    border-left-color:#25D366;
    opacity:.75;
  }
  .pc-top { margin-bottom:.6rem; }
  .pc-linea {
    display:flex; align-items:center; gap:.4rem;
    font-size:.86rem; color:#bbb; margin:.35rem 0;
  }
  .pedido-card.entregado { opacity:.55; border-color:rgba(37,211,102,.3); }
  .pc-top { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:.5rem; }
  .pc-cliente { font-size:1rem; font-weight:800; }
  .pc-folio { font-size:.72rem; color:var(--muted); }
  .pc-total { font-size:1.1rem; font-weight:900; color:#25D366; }
  .pc-linea { font-size:.82rem; color:#ccc; margin:.2rem 0; display:flex; gap:.4rem; }
  .pc-pago {
    display:inline-block; font-size:.78rem; font-weight:800; padding:.35rem .7rem;
    border-radius:8px; margin-top:.5rem;
  }
  .pago-efectivo { background:rgba(255,193,7,.15); color:#FFC107; border:1px solid rgba(255,193,7,.35); }
  .pago-digital { background:rgba(37,211,102,.15); color:#25D366; border:1px solid rgba(37,211,102,.35); }
  .pago-pend { background:rgba(255,255,255,.08); color:#aaa; border:1px solid rgba(255,255,255,.15); }
  .btn-maps {
    display:block; text-align:center; background:rgba(66,133,244,.15);
    border:1px solid rgba(66,133,244,.4); color:#5B9BFF; border-radius:10px;
    padding:.6rem; font-weight:700; font-size:.85rem; text-decoration:none; margin-top:.6rem;
  }
  .vacio { text-align:center; padding:3rem 1rem; color:var(--muted); }
  .vacio .emo { font-size:3rem; margin-bottom:.5rem; }
  .cargando { text-align:center; padding:2rem; color:var(--muted); }

  /* ── Vista de ENTREGA (mapa + orden + cobro) ── */
  #vista-entrega {
    position:fixed; inset:0; background:var(--bg); z-index:200; display:none;
    flex-direction:column;
  }
  #vista-entrega.abierta { display:flex; }
  .ve-header {
    background:linear-gradient(135deg,#FF5A00,#FF8C00); padding:.9rem 1rem;
    display:flex; align-items:center; gap:.7rem; flex-shrink:0;
  }
  .ve-header button.volver {
    background:rgba(255,255,255,.2); border:none; color:#fff; border-radius:10px;
    width:38px; height:38px; font-size:1.2rem; cursor:pointer; flex-shrink:0;
  }
  .ve-header .ve-tit { font-weight:900; font-size:1.05rem; }
  .ve-header .ve-sub { font-size:.72rem; opacity:.9; }
  #mapa-entrega { width:100%; height:38vh; flex-shrink:0; background:#222; }
  .ve-body { flex:1; overflow-y:auto; padding:1rem; }
  .ve-orden {
    background:var(--surface); border:1px solid rgba(255,255,255,.09);
    border-radius:14px; padding:1rem; margin-bottom:.9rem;
  }
  .ve-dato { display:flex; gap:.5rem; font-size:.85rem; margin:.3rem 0; color:#ddd; }
  .ve-dato b { color:#fff; }
  .ve-total-row {
    display:flex; justify-content:space-between; align-items:center;
    margin-top:.7rem; padding-top:.7rem; border-top:1px solid rgba(255,255,255,.1);
  }
  .ve-total-row .lbl { font-size:.9rem; font-weight:700; }
  .ve-total-row .val { font-size:1.4rem; font-weight:900; color:#25D366; }
  .btn-navegar {
    display:block; text-align:center; background:rgba(66,133,244,.15);
    border:1px solid rgba(66,133,244,.4); color:#5B9BFF; border-radius:10px;
    padding:.7rem; font-weight:700; font-size:.85rem; text-decoration:none; margin-bottom:.9rem;
  }
  .cobro-titulo { font-size:.8rem; color:var(--muted); font-weight:700; margin:.3rem 0 .6rem; text-transform:uppercase; letter-spacing:.04em; }
  .cobro-grid { display:grid; grid-template-columns:1fr 1fr; gap:.5rem; }
  .cobro-btn {
    padding:.85rem .5rem; border-radius:12px; border:1.5px solid rgba(255,255,255,.12);
    background:rgba(255,255,255,.04); color:#fff; font-family:inherit; font-size:.85rem;
    font-weight:700; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:.25rem;
  }
  .cobro-btn:active { transform:scale(.97); }
  .cobro-btn.efectivo { border-color:rgba(255,193,7,.4); }
  .cobro-btn.zelle    { border-color:rgba(109,30,212,.5); }
  .cobro-btn.cashapp  { border-color:rgba(0,214,79,.4); }
  .cobro-btn.venmo    { border-color:rgba(0,140,255,.4); }
  .cobro-btn.tarjeta  { border-color:rgba(91,155,255,.4); }
  .ve-pagado {
    background:rgba(37,211,102,.12); border:1px solid rgba(37,211,102,.4);
    color:#25D366; border-radius:12px; padding:1rem; text-align:center; font-weight:800;
  }
  .btn-entregada {
    width:100%; margin-top:.9rem; padding:.9rem; border-radius:12px; border:none;
    background:linear-gradient(135deg,#25D366,#1DA851); color:#fff;
    font-family:inherit; font-size:1rem; font-weight:800; cursor:pointer;
  }
</style>

<style id="ios-compat">
/* ── Compatibilidad iOS / Safari ── */
/* Evitar zoom automático al enfocar inputs (iOS hace zoom si font-size < 16px) */
@supports (-webkit-touch-callout: none) {
  input, select, textarea { font-size: 16px !important; }
}
/* Respetar el notch y áreas seguras del iPhone */
body { padding-left: env(safe-area-inset-left); padding-right: env(safe-area-inset-right); }
/* Momentum scroll suave en iOS */
* { -webkit-overflow-scrolling: touch; }
/* Evitar resaltado azul al tocar botones en iOS */
button, a, .btn-primary, .hbtn, .mp-btn { -webkit-tap-highlight-color: transparent; }
/* Evitar que iOS ajuste el tamaño del texto al rotar */
html { -webkit-text-size-adjust: 100%; }
</style>

<script type="module">
import { db } from '../js/firebase-config.js';
import { collection, onSnapshot, doc, updateDoc, setDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

// Guarda los pedidos actuales para abrirlos en la vista de entrega
let _pedidosActuales = [];
let _mapaLeaflet = null;
let _pedidoAbierto = null;

function _leer(clave) {
    return sessionStorage.getItem(clave) || localStorage.getItem(clave);
}

// Identidad del repartidor (viene del login por PIN de empleado)
const miId     = (_leer('tt_emp_id') || _leer('tt_cajero_id') || '').trim();
const miNombre = (_leer('tt_emp_nombre') || _leer('tt_cajero_nombre') || '').trim();
const miRol    = (_leer('tt_emp_rol') || _leer('tt_cajero_rol') || '').toLowerCase();

// ── Compartir ubicación del tortumóvil en vivo ──────────────────
// El repartidor comparte su posición GPS mientras usa Mi Ruta, para que
// el panel admin pueda ver dónde está cada tortumóvil en tiempo real.
// Se guarda en la colección "ubicaciones" con el id del repartidor.
let _watchId = null;
let _ultimoGuardado = 0;
let _miPosActual = null; // posición actual del repartidor para calcular distancia

function _distanciaMillasRuta(lat1, lng1, lat2, lng2) {
    const R = 3958.8;
    const dLat = (lat2-lat1) * Math.PI/180;
    const dLng = (lng2-lng1) * Math.PI/180;
    const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}
function iniciarCompartirUbicacion() {
    if (!navigator.geolocation || !miId) return;
    if (_watchId !== null) return; // ya está activo
    _watchId = navigator.geolocation.watchPosition(async function(pos){
        const ahora = Date.now();
        // Guardar posición actual para calcular distancias en las tarjetas
        _miPosActual = { lat: pos.coords.latitude, lng: pos.coords.longitude };
        if (window.render) window.render(); // refrescar distancias
        // Guardar como máximo cada 5 segundos para no saturar la base de datos
        if (ahora - _ultimoGuardado < 5000) return;
        _ultimoGuardado = ahora;
        try {
            await setDoc(doc(db, 'ubicaciones', miId), {
                repartidorId: miId,
                nombre: miNombre || miId,
                lat: pos.coords.latitude,
                lng: pos.coords.longitude,
                precision: pos.coords.accuracy || null,
                actualizado: Date.now()
            });
        } catch(e) { /* si falla, se reintenta en el próximo movimiento */ }
    }, function(err){
        // Sin permiso GPS: no se puede compartir ubicación
        console.warn('GPS no disponible para compartir ubicación:', err.message);
    }, { enableHighAccuracy:true, maximumAge:3000, timeout:10000 });
}
// Arrancar el seguimiento si es un repartidor (tiene id)
if (miId) { iniciarCompartirUbicacion(); }

// ── Menú de navegación ──
window.toggleNavMenu = function() {
    const ov = document.getElementById('nav-menu-overlay');
    const abierto = ov.style.display === 'block';
    if (!abierto) construirNavMenu();
    ov.style.display = abierto ? 'none' : 'block';
};
function construirNavMenu() {
    const esGerente = /gerente|supervisor|admin|dueñ/.test(miRol);
    const items = [
        ['🏪','Tienda (Ordenar)','../ordenar.html', false],
        ['🍳','Cocina','cocina.html', false],
        ['🛵','Mi Ruta','mi-ruta.html', false],
        ['🔔','Pedidos Disponibles','disponibles.html', false],
        ['📊','Reportes','reportes.html', true],
        ['⚙️','Panel Admin','admin.html', true],
        ['🧑‍💼','Panel Empleado','empleados.html', false],
    ];
    var _navCont = document.getElementById('nav-menu-items');
    if (!_navCont) return; // menú propio removido, ahora usa barra compartida
    _navCont.innerHTML = items.map(function(it){
        if (it[3] && !esGerente) return '';
        return '<a href="'+it[2]+'" style="display:flex;align-items:center;gap:.8rem;padding:.9rem 1.1rem;'+
            'color:#eee;text-decoration:none;font-size:.92rem;font-weight:600;border-bottom:1px solid rgba(255,255,255,.05);">'+
            '<span style="font-size:1.2rem;width:26px;text-align:center;">'+it[0]+'</span>'+it[1]+'</a>';
    }).join('');
}

// Si no hay sesión de empleado, mandar a entrar
if (!miId && !miNombre) {
    document.getElementById('lista-ruta').innerHTML =
        '<div class="vacio"><div class="emo">🔒</div>Necesitas entrar con tu PIN de empleado para ver tu ruta.' +
        '<br><br><a href="bienvenida.html" style="color:#FF5A00;font-weight:700;">Ir a entrar</a></div>';
} else {
    document.getElementById('rep-nombre').textContent = miNombre || miId;
    escucharRuta();
}

// ¿Este pedido es de este repartidor?
function esMiPedido(p) {
    if (p.repartidorId && miId && p.repartidorId === miId) return true;
    // Respaldo por nombre (por si el id no coincide exactamente)
    if (p.repartidorNombre && miNombre &&
        p.repartidorNombre.trim().toLowerCase() === miNombre.toLowerCase()) return true;
    return false;
}

function metodoPagoInfo(p) {
    const m = (p.metodoPagoReal || p.metodoPago || '').toLowerCase();
    if (!p.estadoPago || p.estadoPago !== 'Pagado') {
        // Aún no pagado: si es domicilio, probablemente cobra el repartidor
        if (m.includes('efectivo')) return { txt:'💵 Cobrar EFECTIVO', clase:'pago-efectivo' };
        return { txt:'Pendiente de pago', clase:'pago-pend' };
    }
    if (m.includes('efectivo')) return { txt:'💵 Efectivo', clase:'pago-efectivo' };
    if (m) return { txt:'✅ Pagado ('+ (p.metodoPagoReal||p.metodoPago) +')', clase:'pago-digital' };
    return { txt:'✅ Pagado', clase:'pago-digital' };
}

function render(pedidos) {
    const cont = document.getElementById('lista-ruta');
    const resumen = document.getElementById('resumen');

    if (!pedidos.length) {
        resumen.style.display = 'none';
        cont.innerHTML = '<div class="vacio"><div class="emo">✅</div>No tienes pedidos asignados por ahora.<br>Cuando el admin te asigne entregas, aparecerán aquí.</div>';
        return;
    }

    // Pendientes primero, entregados al final
    pedidos.sort((a,b) => {
        const ea = a.entregado ? 1 : 0, eb = b.entregado ? 1 : 0;
        if (ea !== eb) return ea - eb;
        return (a.folio||0) - (b.folio||0);
    });

    let pend = 0, hechas = 0, efectivo = 0;
    pedidos.forEach(p => {
        if (p.entregado) hechas++; else pend++;
        const m = (p.metodoPagoReal || p.metodoPago || '').toLowerCase();
        if (!p.entregado && m.includes('efectivo') && p.estadoPago !== 'Pagado') {
            efectivo += Number(p.totalNum) || parseFloat(String(p.total).replace(/[^0-9.]/g,'')) || 0;
        }
    });
    document.getElementById('r-pend').textContent = pend;
    document.getElementById('r-hechas').textContent = hechas;
    document.getElementById('r-efectivo').textContent = '$' + efectivo.toFixed(0);
    resumen.style.display = 'flex';

    cont.innerHTML = pedidos.map(p => {
        const pago = metodoPagoInfo(p);
        const folio = p.folioStr || (p.id ? p.id.slice(-4).toUpperCase() : '');
        const dir = p.ubicacionCliente && p.ubicacionCliente.direccion ? p.ubicacionCliente.direccion : '';
        const lat = p.ubicacionCliente && p.ubicacionCliente.lat;
        const lng = p.ubicacionCliente && p.ubicacionCliente.lng;
        const mapsUrl = (lat && lng) ? 'https://www.google.com/maps?q='+lat+','+lng
                        : (dir ? 'https://www.google.com/maps/search/'+encodeURIComponent(dir) : '');
        const itemsTxt = (typeof p.items === 'string' ? p.items : '').split(' | ').filter(Boolean);

        return '<div class="pedido-card '+(p.entregado?'entregado':'')+'">' +
            '<div class="pc-top">' +
              '<div><div class="pc-cliente">'+(p.cliente||p.nombre||'Cliente')+'</div>' +
              '<div class="pc-folio">Orden #'+folio+(p.zonaEntregaNombre?(' · '+p.zonaEntregaNombre):'')+'</div></div>' +
              '<div class="pc-total">'+(p.total||'')+'</div>' +
            '</div>' +
            (p.telefono ? '<div class="pc-linea">📞 <a href="tel:'+p.telefono+'" style="color:#5B9BFF;">'+p.telefono+'</a></div>' : '') +
            (dir ? '<div class="pc-linea">📍 '+dir+'</div>' : '') +
            (p.horarioEntregaEtiqueta ? '<div class="pc-linea">🕐 '+p.horarioEntregaEtiqueta+'</div>' : '') +
            (itemsTxt.length ? '<div class="pc-linea" style="flex-direction:column;gap:.1rem;margin-top:.4rem;">'+
                itemsTxt.map(function(it){ return '<div>• '+it+'</div>'; }).join('')+'</div>' : '') +
            '<div><span class="pc-pago '+pago.clase+'">'+pago.txt+'</span></div>' +
            // Botón pedir ubicación (solo si el cliente aún no la compartió)
            ((!lat || !lng) ?
              '<button class="btn-pedir-ubi" style="width:100%;border:1px solid rgba(255,90,0,.4);' +
              'background:rgba(255,90,0,.12);color:#FF7A33;border-radius:10px;padding:.7rem;' +
              'font-weight:700;font-size:.85rem;cursor:pointer;margin-bottom:.5rem;font-family:inherit;" ' +
              'onclick="pedirUbicacionRuta(\''+p.id+'\',\''+(p.telefono||'')+'\',\''+String(p.cliente||p.nombre||'').replace(/\'/g,'')+'\')">' +
              '📍 Pedir ubicación al cliente</button>'
              :
              '<div style="text-align:center;font-size:.75rem;color:#25D366;margin-bottom:.5rem;font-weight:600;">✅ Cliente compartió su ubicación</div>'
            ) +
            '<button class="btn-maps" style="width:100%;border:1px solid rgba(66,133,244,.4);cursor:pointer;" onclick="abrirEntrega(\''+p.id+'\')">🗺️ Cómo llegar y cobrar</button>' +

            // ── Estado de la orden + repartidor + cliente ──
            '<div style="margin-top:.7rem;padding-top:.7rem;border-top:1px solid rgba(255,255,255,.08);font-size:.8rem;line-height:1.7;">' +
              '<div style="display:flex;justify-content:space-between;align-items:center;">' +
                '<span style="color:#888;">Estado:</span>' +
                '<span style="font-weight:800;color:' + (p.entregado ? '#25D366' : '#FFC107') + ';">' +
                  (p.entregado ? '✅ Entregado' : (p.estado || 'Pendiente')) + '</span>' +
              '</div>' +
              '<div style="display:flex;justify-content:space-between;">' +
                '<span style="color:#888;">Cliente:</span>' +
                '<span style="font-weight:700;color:#eee;">' + (p.cliente||p.nombre||'—') + '</span>' +
              '</div>' +
              '<div style="display:flex;justify-content:space-between;">' +
                '<span style="color:#888;">Repartidor:</span>' +
                '<span style="font-weight:700;color:' + (p.repartidorNombre ? '#5B9BFF' : '#888') + ';">' +
                  '🛵 ' + (p.repartidorNombre || 'Sin asignar') + '</span>' +
              '</div>' +
              // Distancia al cliente (si tenemos ambas posiciones)
              ((_miPosActual && lat && lng)
                ? '<div style="display:flex;justify-content:space-between;align-items:center;margin-top:.3rem;padding-top:.3rem;border-top:1px dashed rgba(255,255,255,.1);">' +
                    '<span style="color:#888;">Distancia:</span>' +
                    '<span style="font-weight:900;color:#FF7A33;font-size:.95rem;">📍 ' +
                    _distanciaMillasRuta(_miPosActual.lat, _miPosActual.lng, lat, lng).toFixed(1) + ' millas</span>' +
                  '</div>'
                : (lat && lng
                    ? '<div style="font-size:.72rem;color:#888;margin-top:.3rem;text-align:center;">Activa tu GPS para ver la distancia al cliente</div>'
                    : '')
              ) +
            '</div>' +

            // ── Botón marcar entregado (o sello si ya está entregado) ──
            (p.entregado
              ? '<div style="margin-top:.7rem;text-align:center;background:rgba(37,211,102,.12);' +
                'border:1px solid rgba(37,211,102,.35);color:#25D366;border-radius:10px;padding:.7rem;' +
                'font-weight:800;font-size:.9rem;">🎉 Orden Entregada</div>'
              : '<button onclick="marcarEntregadoDirecto(\''+p.id+'\')" ' +
                'style="width:100%;margin-top:.7rem;padding:.8rem;border:none;border-radius:10px;' +
                'background:linear-gradient(135deg,#25D366,#1DA851);color:#fff;font-family:inherit;' +
                'font-size:.9rem;font-weight:800;cursor:pointer;">✅ Marcar como Entregado</button>'
            ) +
        '</div>';
    }).join('');
}


// ── PEDIR UBICACIÓN AL CLIENTE (compartir GPS) ──
window.pedirUbicacionRuta = function(pedidoId, telefono, nombre) {
    // Link que el cliente abre para compartir su GPS
    var base = window.location.origin + window.location.pathname.replace(/pages\/mi-ruta\.html$/, '');
    var link = base + 'ubicacion.html?pedido=' + pedidoId;

    var saludo = nombre ? ('Hola ' + nombre + '!') : 'Hola!';
    var mensaje =
        saludo + ' Soy tu repartidor de Tortas Tortuga \uD83D\uDEF5\n\n' +
        'Para llevarte tu pedido necesito tu ubicacion exacta.\n\n' +
        'Solo abre este link y toca "Compartir mi ubicacion":\n' + link;

    // Si hay telefono, intentar abrir WhatsApp/SMS; si no, copiar el link
    var num = String(telefono || '').replace(/[^0-9]/g, '');

    if (num) {
        if (num.length === 10) num = '1' + num;
        // Preferir SMS (mas universal para clientes)
        var smsUrl = 'sms:+' + num + '?body=' + encodeURIComponent(mensaje);
        window.open(smsUrl, '_blank');
    } else {
        // Sin telefono: copiar el link al portapapeles
        if (navigator.clipboard) {
            navigator.clipboard.writeText(link).then(function(){
                mostrarToastRuta('📋 Link copiado. Compártelo con el cliente.');
            }).catch(function(){
                prompt('Copia este link y mándalo al cliente:', link);
            });
        } else {
            prompt('Copia este link y mándalo al cliente:', link);
        }
    }
};

function mostrarToastRuta(txt) {
    var toast = document.createElement('div');
    toast.textContent = txt;
    toast.style.cssText = 'position:fixed;bottom:80px;left:50%;transform:translateX(-50%);' +
        'background:#25D366;color:#fff;padding:.7rem 1.3rem;border-radius:20px;font-weight:700;' +
        'z-index:99999;box-shadow:0 4px 16px rgba(0,0,0,.4);font-family:system-ui,sans-serif;max-width:90%;text-align:center;';
    document.body.appendChild(toast);
    setTimeout(function(){ toast.remove(); }, 2500);
}

function escucharRuta() {
    onSnapshot(collection(db, 'pedidos'), snap => {
        const todos = snap.docs.map(d => ({ id:d.id, ...d.data() }));
        // Solo los míos, y que no estén archivados
        const mios = todos.filter(p => esMiPedido(p) && p.archivado !== true);
        _pedidosActuales = mios;
        render(mios);
        // Si hay una entrega abierta, refrescar su estado de pago en vivo
        if (_pedidoAbierto) {
            const actualizado = mios.find(x => x.id === _pedidoAbierto.id);
            if (actualizado) { _pedidoAbierto = actualizado; refrescarZonaCobro(actualizado); }
        }
    }, err => {
        document.getElementById('lista-ruta').innerHTML =
            '<div class="vacio"><div class="emo">⚠️</div>No se pudo cargar tu ruta. Revisa tu conexión.</div>';
    });
}

// ── VISTA DE ENTREGA (mapa + orden + cobro) ──────────────────
window.abrirEntrega = function(pedidoId) {
    const p = _pedidosActuales.find(x => x.id === pedidoId);
    if (!p) return;
    _pedidoAbierto = p;

    const folio = p.folioStr || (p.id ? p.id.slice(-4).toUpperCase() : '');
    const dir = p.ubicacionCliente && p.ubicacionCliente.direccion ? p.ubicacionCliente.direccion : '';
    const lat = p.ubicacionCliente && p.ubicacionCliente.lat;
    const lng = p.ubicacionCliente && p.ubicacionCliente.lng;

    document.getElementById('ve-cliente').textContent = p.cliente || p.nombre || 'Cliente';
    document.getElementById('ve-folio').textContent = 'Orden #' + folio + (p.zonaEntregaNombre ? (' · ' + p.zonaEntregaNombre) : '');
    document.getElementById('ve-dir').textContent = dir || 'Sin dirección';
    document.getElementById('ve-dir-row').style.display = dir ? 'flex' : 'none';
    document.getElementById('ve-tel').innerHTML = p.telefono ? '<a href="tel:'+p.telefono+'" style="color:#5B9BFF;">'+p.telefono+'</a>' : '—';
    document.getElementById('ve-tel-row').style.display = p.telefono ? 'flex' : 'none';
    document.getElementById('ve-hora').textContent = p.horarioEntregaEtiqueta || '—';
    document.getElementById('ve-hora-row').style.display = p.horarioEntregaEtiqueta ? 'flex' : 'none';
    document.getElementById('ve-total').textContent = p.total || '$0.00';

    const itemsTxt = (typeof p.items === 'string' ? p.items : '').split(' | ').filter(Boolean);
    document.getElementById('ve-items').innerHTML = itemsTxt.length
        ? itemsTxt.map(function(it){ return '<div>• '+it+'</div>'; }).join('')
        : '';

    // Botón de navegación externa (por si quiere voz)
    const navBtn = document.getElementById('ve-navegar');
    if (lat && lng) navBtn.href = 'https://www.google.com/maps/dir/?api=1&destination=' + lat + ',' + lng;
    else if (dir) navBtn.href = 'https://www.google.com/maps/search/' + encodeURIComponent(dir);
    else navBtn.style.display = 'none';

    refrescarZonaCobro(p);

    document.getElementById('vista-entrega').classList.add('abierta');

    // Inicializar el mapa después de que la vista sea visible
    setTimeout(function(){ initMapaEntrega(lat, lng, p.cliente || 'Cliente', dir); }, 100);
};

window.cerrarEntrega = function() {
    document.getElementById('vista-entrega').classList.remove('abierta');
    _pedidoAbierto = null;
    if (_mapaLeaflet) { _mapaLeaflet.remove(); _mapaLeaflet = null; }
};

function initMapaEntrega(lat, lng, nombre, dir) {
    const cont = document.getElementById('mapa-entrega');
    if (_mapaLeaflet) { _mapaLeaflet.remove(); _mapaLeaflet = null; }

    if (!lat || !lng) {
        cont.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#888;font-size:.85rem;text-align:center;padding:1rem;">Este pedido no tiene ubicación GPS.<br>Usa la dirección y el botón de navegar.</div>';
        return;
    }
    cont.innerHTML = '';

    _mapaLeaflet = L.map('mapa-entrega').setView([lat, lng], 15);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap',
        maxZoom: 19
    }).addTo(_mapaLeaflet);

    // Pin del cliente
    L.marker([lat, lng]).addTo(_mapaLeaflet)
        .bindPopup('<b>' + nombre + '</b>' + (dir ? '<br>' + dir : ''))
        .openPopup();

    // Intentar ubicar al repartidor y dibujar la ruta (línea recta)
    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(function(pos){
            const rlat = pos.coords.latitude, rlng = pos.coords.longitude;
            const yo = L.circleMarker([rlat, rlng], { radius:8, color:'#FF5A00', fillColor:'#FF5A00', fillOpacity:1 }).addTo(_mapaLeaflet);
            yo.bindPopup('Tú estás aquí');
            // Línea entre repartidor y cliente
            L.polyline([[rlat, rlng], [lat, lng]], { color:'#FF5A00', weight:3, dashArray:'6,8' }).addTo(_mapaLeaflet);
            // Ajustar el mapa para ver ambos puntos
            _mapaLeaflet.fitBounds([[rlat, rlng], [lat, lng]], { padding:[50,50] });
        }, function(){ /* sin permiso GPS: solo mostramos al cliente */ }, { enableHighAccuracy:true, timeout:8000 });
    }
    // Forzar recálculo de tamaño (Leaflet a veces lo necesita)
    setTimeout(function(){ if(_mapaLeaflet) _mapaLeaflet.invalidateSize(); }, 200);
}

// Muestra botones de cobro o el estado "pagado" según corresponda
function refrescarZonaCobro(p) {
    const cobroZona = document.getElementById('ve-cobro-zona');
    const pagadoZona = document.getElementById('ve-pagado-zona');
    if (p.estadoPago === 'Pagado') {
        cobroZona.style.display = 'none';
        pagadoZona.style.display = 'block';
        document.getElementById('ve-pagado-txt').textContent =
            '✅ Pagado' + (p.metodoPagoReal ? ' con ' + p.metodoPagoReal : '');
    } else {
        cobroZona.style.display = 'block';
        pagadoZona.style.display = 'none';
    }
}

// Procesa el cobro (mismo patrón que el admin)
window.marcarEnCamino = async function() {
    if (!_pedidoAbierto) return;
    try {
        await updateDoc(doc(db, 'pedidos', _pedidoAbierto.id), {
            estado: 'En camino 🛵',
            'tiempos.enCamino': Date.now()
        });
        if (window.ttAlert) window.ttAlert('🛵 Marcado en camino. El cliente ya puede verlo.');
        // Ocultar el botón para no marcarlo dos veces
        var btn = document.getElementById('ve-btn-camino');
        if (btn) { btn.textContent = '✅ Vas en camino'; btn.style.opacity = '.6'; btn.disabled = true; }
    } catch(err) {
        alert('Error al marcar en camino. Revisa tu conexión.');
    }
};

window.cobrarEntrega = async function(metodo) {
    if (!_pedidoAbierto) return;
    const confirmar = window.ttConfirm
        ? await window.ttConfirm('¿Confirmar cobro de ' + (_pedidoAbierto.total||'') + ' con ' + metodo + '?')
        : confirm('¿Confirmar cobro con ' + metodo + '?');
    if (!confirmar) return;
    try {
        await updateDoc(doc(db, 'pedidos', _pedidoAbierto.id), {
            estadoPago: 'Pagado',
            metodoPagoReal: metodo,
            cobradoPor: miNombre || miId,
            cobradoEn: new Date().toISOString()
        });
        // El onSnapshot refrescará la zona de cobro automáticamente
        if (window.ttAlert) window.ttAlert('✅ Cobro registrado: ' + metodo);
    } catch(err) {
        alert('Error al registrar el cobro. Revisa tu conexión.');
    }
};

// El REPARTIDOR marca la orden como Entregada (cierra su parte del flujo)
window.marcarEntregadoDirecto = async function(pedidoId) {
    if (!pedidoId) return;
    const confirmar = window.ttConfirm
        ? await window.ttConfirm('¿Marcar esta orden como ENTREGADA?')
        : confirm('¿Marcar como entregada?');
    if (!confirmar) return;
    try {
        await updateDoc(doc(db, 'pedidos', pedidoId), {
            estado: 'Entregado 🎉',
            entregado: true,
            'tiempos.entregada': Date.now()
        });
        if (window.ttAlert) window.ttAlert('🎉 Orden marcada como entregada.');
    } catch(err) {
        alert('Error al marcar entregado. Revisa tu conexión.');
    }
};

window.marcarEntregado = async function() {
    if (!_pedidoAbierto) return;
    const confirmar = window.ttConfirm
        ? await window.ttConfirm('¿Marcar esta orden como ENTREGADA?')
        : confirm('¿Marcar como entregada?');
    if (!confirmar) return;
    try {
        await updateDoc(doc(db, 'pedidos', _pedidoAbierto.id), {
            estado: 'Entregado 🎉',
            entregado: true,
            'tiempos.entregada': Date.now()
        });
        if (window.ttAlert) window.ttAlert('🎉 Orden marcada como entregada.');
        // Cerrar la vista de entrega
        if (window.cerrarEntrega) window.cerrarEntrega();
    } catch(err) {
        alert('Error al marcar entregado. Revisa tu conexión.');
    }
};
