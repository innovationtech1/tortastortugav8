<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Entrar - Tortas Tortuga</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/auth.css">
<style>
  /* Ajustes especificos para el login por telefono */
  .paso { display:none; }
  .paso.activo { display:block; }
  .code-input { text-align:center !important; font-size:1.8rem !important; letter-spacing:.5rem !important; font-weight:800 !important; }
  .codigo-demo {
    background:rgba(251,183,36,.1); border:1px solid rgba(251,183,36,.3);
    border-radius:12px; padding:.9rem; margin-bottom:1rem; text-align:center;
  }
  .codigo-demo .cd-label { font-size:.7rem; color:#FBB724; text-transform:uppercase; letter-spacing:.05em; font-weight:700; }
  .codigo-demo .cd-code { font-size:1.8rem; font-weight:900; color:#FBB724; letter-spacing:.4rem; margin-top:.2rem; }
  .intro-badge, .demo-badge {
    background:rgba(167,139,250,.12); border:1px solid rgba(167,139,250,.3);
    color:#A78BFA; font-size:.68rem; padding:.35rem .8rem; border-radius:20px;
    display:inline-block; margin:0 auto 1rem; font-weight:700;
  }
  .btn-volver { background:none !important; box-shadow:none !important; color:#888 !important; font-size:.85rem !important; font-weight:600 !important; margin-top:.6rem !important; }
  .modo-tabs { display:flex; gap:.4rem; margin-bottom:1.1rem; background:rgba(255,255,255,.04); border-radius:12px; padding:.3rem; }
  .modo-tab { flex:1; background:none; border:none; color:#888; font-family:inherit; font-size:.78rem; font-weight:700; padding:.6rem .4rem; border-radius:9px; cursor:pointer; transition:.15s; }
  .modo-tab.activo { background:rgba(255,90,0,.15); color:#FF5A00; }
  .cuenta-tabs { display:flex; gap:.4rem; margin-bottom:1rem; }
  .cuenta-tab { flex:1; background:rgba(255,255,255,.03); border:1px solid rgba(255,255,255,.1); color:#999; font-family:inherit; font-size:.82rem; font-weight:700; padding:.55rem; border-radius:9px; cursor:pointer; }
  .cuenta-tab.activo { border-color:#FF5A00; color:#FF5A00; background:rgba(255,90,0,.08); }
  .cuenta-paso { display:none; }
  .cuenta-paso.activo { display:block; }
</style>

<style id="ios-compat">
/* ── Compatibilidad iOS / Safari ── */
/* Evitar zoom automático al enfocar inputs (iOS hace zoom si font-size < 16px) */
@supports (-webkit-touch-callout: none) {
  input, select, textarea { font-size: 16px !important; }
}
/* Respetar el notch y áreas seguras del iPhone */
body { padding-left: env(safe-area-inset-left); padding-right: env(safe-area-inset-right); }
/* Momentum scroll suave en iOS */
* { -webkit-overflow-scrolling: touch; }
/* Evitar resaltado azul al tocar botones en iOS */
button, a, .btn-primary, .hbtn, .mp-btn { -webkit-tap-highlight-color: transparent; }
/* Evitar que iOS ajuste el tamaño del texto al rotar */
html { -webkit-text-size-adjust: 100%; }
</style>
</head>
<body>

<div class="auth-bg">
    <div class="auth-card">

        <div class="auth-logo">
            <span class="logo-emoji">🐢</span>
            <h1 class="logo-text">Tortas Tortuga</h1>
            <p class="logo-sub">Entra para ordenar</p>
        </div>

        

        <div id="modo-telefono-wrap">
        <div style="text-align:center;">
            <span class="intro-badge" style="display:inline-block;background:rgba(255,90,0,.12);border:1px solid rgba(255,90,0,.25);color:#FF7A33;font-size:.8rem;font-weight:600;padding:.4rem .9rem;border-radius:20px;">🐢 Entra con tu nombre y teléfono</span>
        </div>

        <!-- PASO 1: Telefono -->
        <div id="paso-telefono" class="paso activo">
            <div class="field-wrap">
                <label class="field-label">Tu nombre</label>
                <input type="text" id="nombre" class="field-input" placeholder="Ej: Juan" autocomplete="off">
            </div>

            <div class="field-wrap">
                <label class="field-label">Tu teléfono</label>
                <input type="tel" id="telefono" class="field-input" inputmode="tel" placeholder="210-555-1234" autocomplete="off">
            </div>

            <div id="status-1" class="auth-message" style="display:none;"></div>

            <button class="btn-primary" onclick="enviarCodigo()" id="btn-enviar">
                <span class="btn-text">Entrar a ordenar</span>
            </button>
        </div>

                <!-- PASO 2: Ubicación -->
                <div id="paso-ubicacion" class="paso">
                    <div style="text-align:center;margin-bottom:1.2rem;">
                        <div style="font-size:2.2rem;margin-bottom:.4rem;">📍</div>
                        <div style="font-size:.95rem;color:#fff;font-weight:700;">¿Dónde te encuentras?</div>
                        <div style="font-size:.82rem;color:#aaa;margin-top:.3rem;">
                            Compártenos tu ubicación para llevarte tu orden más rápido.
                        </div>
                    </div>

                    <div id="ubi-estado" style="background:rgba(255,90,0,.08);border:1px solid rgba(255,90,0,.25);border-radius:12px;padding:1rem;text-align:center;margin-bottom:1rem;">
                        <div style="font-size:.85rem;color:#FF7A33;font-weight:700;">📡 Toca el botón para compartir tu ubicación</div>
                    </div>

                    <div id="ubi-mapa" style="display:none;height:180px;border-radius:12px;overflow:hidden;margin-bottom:1rem;"></div>

                    <div id="status-2" class="auth-message" style="display:none;"></div>

                    <button class="btn-primary" onclick="compartirMiUbicacion()" id="btn-ubicacion">
                        <span class="btn-text">📍 Compartir mi ubicación</span>
                    </button>
                    <button class="btn-primary" onclick="entrarSinUbicacion()" id="btn-saltar" style="background:rgba(255,255,255,.08);color:#aaa;margin-top:.5rem;">
                        <span class="btn-text">Continuar sin ubicación →</span>
                    </button>
                    <button class="btn-primary btn-volver" onclick="volverPaso1()">← Cambiar datos</button>
                </div>
        </div>

        <!-- MODO CUENTA (email + contraseña, Firebase Auth real) -->
        

        

    </div>
</div>

<script type="module">
import { auth, db } from '../js/firebase-config.js';
import { doc, setDoc, getDoc, getDocs, collection, query, where } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
import {
    createUserWithEmailAndPassword, signInWithEmailAndPassword,
    sendPasswordResetEmail, updateProfile
} from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';

let _codigoGenerado = null;
let _datosCliente = null;

function showStatus(id, msg, tipo) {
    var el = document.getElementById(id);
    if (!el) return;
    el.textContent = msg;
    el.className = 'auth-message ' + (tipo || '');
    el.style.color = tipo === 'error' ? '#F44336' : (tipo === 'success' ? '#25D366' : '#FBB724');
    el.style.display = 'block';
}

/* ── Selector Telefono / Cuenta ─────────────────────────────── */
window.cambiarModo = function(modo) {
    // Solo modo teléfono (opción de email eliminada)
    var wrap = document.getElementById('modo-telefono-wrap');
    if (wrap) wrap.style.display = 'block';
};

window.cambiarCuentaTab = function(tab) {
    ['login','registro','recuperar'].forEach(function(t) {
        var el = document.getElementById('cuenta-' + t);
        if (el) el.classList.toggle('activo', t === tab);
    });
    document.getElementById('tab-login')?.classList.toggle('activo', tab === 'login');
    document.getElementById('tab-registro')?.classList.toggle('activo', tab === 'registro');
};

window.mostrarRecuperar = function() { window.cambiarCuentaTab('recuperar'); };

/* ── Guardar sesion de cliente (comun a telefono y cuenta) ──── */
function guardarSesionCliente(nombre, telefono, uid) {
    sessionStorage.setItem('tt_cliente_nombre', nombre);
    sessionStorage.setItem('tt_cliente_telefono', telefono || '');
    sessionStorage.setItem('tt_cliente_ts', Date.now().toString());
    if (uid) sessionStorage.setItem('tt_cliente_uid', uid);
    else sessionStorage.removeItem('tt_cliente_uid');
    // Duplicar en localStorage: se comparte entre pestañas, y "Mi Pedido"
    // se abre en pestaña nueva donde sessionStorage no está disponible.
    localStorage.setItem('tt_cliente_nombre', nombre);
    localStorage.setItem('tt_cliente_telefono', telefono || '');
    localStorage.setItem('tt_cliente_ts', Date.now().toString());
    if (uid) localStorage.setItem('tt_cliente_uid', uid);
    else localStorage.removeItem('tt_cliente_uid');
}

/* ── LOGIN POR TELEFONO (verificacion por codigo) ──────── */
// Teléfonos obviamente falsos que rechazamos
const TELEFONOS_FALSOS = ['0000000000','1111111111','2222222222','3333333333',
    '4444444444','5555555555','6666666666','7777777777','8888888888','9999999999',
    '1234567890','0123456789'];
const MAX_PEDIDOS_ACTIVOS = 5; // límite anti-spam por teléfono

window.enviarCodigo = async function() {
    const nombre = (document.getElementById('nombre').value || '').trim();
    const tel = (document.getElementById('telefono').value || '').trim();
    const soloDigitos = tel.replace(/[^0-9]/g, '');

    // ── Validaciones al estilo Tortas Tortuga ──
    // 1a. Nombre vacío
    if (!nombre) {
        showStatus('status-1', '🐢 ¡Hola! Primero dinos tu nombre para saludarte bien.', 'error');
        document.getElementById('nombre').focus();
        return;
    }
    // 1b. Nombre muy corto / sin letras reales
    const letras = (nombre.match(/[a-zA-ZáéíóúñÁÉÍÓÚÑ]/g) || []).length;
    if (letras < 2) {
        showStatus('status-1', '🐢 Ese nombre está muy cortito. Escríbelo completo porfa.', 'error');
        document.getElementById('nombre').focus();
        return;
    }
    // 2a. Teléfono vacío
    if (!soloDigitos) {
        showStatus('status-1', '📱 Nos falta tu teléfono para avisarte cuando esté tu orden.', 'error');
        document.getElementById('telefono').focus();
        return;
    }
    // 2b. Teléfono incompleto
    if (soloDigitos.length !== 10) {
        showStatus('status-1', '📱 Tu teléfono debe tener 10 dígitos. Revísalo tantito.', 'error');
        document.getElementById('telefono').focus();
        return;
    }
    // 3. Rechazar teléfonos obviamente falsos
    if (TELEFONOS_FALSOS.indexOf(soloDigitos) >= 0) {
        showStatus('status-1', '🤔 Ese número no nos convence. Usa tu teléfono real para avisarte de tu orden.', 'error'); return;
    }
    // 4. No puede empezar en 0 o 1 (los códigos de área de EE.UU. no lo hacen)
    if (soloDigitos[0] === '0' || soloDigitos[0] === '1') {
        showStatus('status-1', '📞 Revisa tu teléfono, parece que le falta algo.', 'error'); return;
    }

    showStatus('status-1', 'Entrando…', 'info');

    // ── Anti-spam: límite de pedidos activos por teléfono ──
    try {
        const q = query(collection(db, 'pedidos'), where('telefono', '==', soloDigitos));
        const snap = await getDocs(q);
        let activos = 0;
        snap.forEach(function(d){
            const p = d.data();
            // Cuenta como activo si no está archivado ni entregado
            if (p.archivado !== true && !(p.estado || '').includes('Entregado')) activos++;
        });
        if (activos >= MAX_PEDIDOS_ACTIVOS) {
            showStatus('status-1', 'Tienes muchos pedidos en proceso. Espera a que se completen antes de pedir más.', 'error');
            return;
        }
    } catch(e) {
        // Si falla la verificación (ej. sin conexión), dejamos pasar — la revisión final la hace el admin
        console.warn('No se pudo verificar límite de pedidos:', e);
    }

    // ── Guardar/actualizar cliente y reconocer si ya existía ──
    let clienteConocido = false;
    try {
        const clienteId = 'cliente_' + soloDigitos;
        const ref = doc(db, 'clientes', clienteId);
        const existente = await getDoc(ref);
        if (existente.exists()) clienteConocido = true;
        await setDoc(ref, {
            nombre: nombre,
            telefono: soloDigitos,
            ultimoAcceso: new Date().toISOString(),
            visitas: ((existente.exists() && existente.data().visitas) || 0) + 1,
        }, { merge: true });
    } catch(e) {
        console.warn('No se pudo guardar el cliente:', e);
    }

    // ── Guardar datos y pasar al paso de UBICACIÓN ──
    // (Sin SMS). Guardamos la sesión ya; la ubicación es el siguiente paso.
    guardarSesionCliente(nombre, soloDigitos, null);
    _datosCliente = { nombre: nombre, telefono: soloDigitos, conocido: clienteConocido };
    // Pasar al paso de ubicación
    document.getElementById('paso-telefono').classList.remove('activo');
    document.getElementById('paso-ubicacion').classList.add('activo');
}

// ── Compartir ubicación GPS y entrar ──
window.compartirMiUbicacion = function() {
    var estadoEl = document.getElementById('ubi-estado');
    var btnEl = document.getElementById('btn-ubicacion');
    if (!navigator.geolocation) {
        showStatus('status-2', 'Tu navegador no soporta ubicación. Puedes continuar sin ella.', 'error');
        return;
    }
    if (estadoEl) estadoEl.innerHTML = '<div style="font-size:.85rem;color:#FF7A33;font-weight:700;">📡 Obteniendo tu ubicación…</div>';
    if (btnEl) btnEl.disabled = true;

    navigator.geolocation.getCurrentPosition(
        function(pos) {
            var lat = pos.coords.latitude;
            var lng = pos.coords.longitude;
            var precision = Math.round(pos.coords.accuracy || 0);
            // Guardar la ubicación en la sesión del cliente
            var ubi = { lat: lat, lng: lng, precision: precision, compartidaEn: new Date().toISOString() };
            try {
                sessionStorage.setItem('tt_cliente_ubicacion', JSON.stringify(ubi));
                localStorage.setItem('tt_cliente_ubicacion', JSON.stringify(ubi));
            } catch(e) {}

            if (estadoEl) estadoEl.innerHTML = '<div style="font-size:.85rem;color:#25D366;font-weight:700;">✅ Ubicación lista (±' + precision + 'm)</div>';
            // Mini mapa de confirmación
            var mapaEl = document.getElementById('ubi-mapa');
            if (mapaEl) {
                mapaEl.style.display = 'block';
                mapaEl.innerHTML = '<iframe src="https://maps.google.com/maps?q=' + lat + ',' + lng + '&z=16&output=embed" style="width:100%;height:100%;border:0;"></iframe>';
            }
            if (btnEl) { btnEl.innerHTML = '<span class="btn-text">✅ Ubicación compartida — Entrar</span>'; btnEl.disabled = false; btnEl.setAttribute('onclick', 'irAlMenu()'); }
            var saludo = (_datosCliente && _datosCliente.conocido) ? ('¡Hola de nuevo, ' + _datosCliente.nombre + '! 🐢') : ('¡Bienvenido, ' + _datosCliente.nombre + '! 🐢');
            showStatus('status-2', saludo, 'success');
        },
        function(err) {
            if (estadoEl) estadoEl.innerHTML = '<div style="font-size:.85rem;color:#F44336;font-weight:700;">No pudimos obtener tu ubicación</div>';
            showStatus('status-2', 'No se pudo obtener tu ubicación. Puedes continuar sin ella y darla después.', 'error');
            if (btnEl) btnEl.disabled = false;
        },
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
    );
};

// Entrar sin ubicación (opcional)
window.entrarSinUbicacion = function() { irAlMenu(); };

// Ir al menú
window.irAlMenu = function() {
    window.location.href = '../ordenar.html';
};

// Verificar el código ingresado
window.verificarCodigoSMS = function() {
    const ingresado = (document.getElementById('codigo-input').value || '').trim();
    if (ingresado.length !== 4) {
        showStatus('status-2', '🔢 Escribe los 4 dígitos que te enviamos.', 'error'); return;
    }
    if (ingresado !== _codigoGenerado) {
        showStatus('status-2', '❌ Ese código no coincide. Revísalo e inténtalo de nuevo.', 'error'); return;
    }
    // Código correcto → entrar
    const d = _datosCliente || {};
    guardarSesionCliente(d.nombre, d.telefono, null);
    const saludo = d.conocido ? ('¡Hola de nuevo, ' + d.nombre + '! 🐢') : ('¡Bienvenido, ' + d.nombre + '!');
    showStatus('status-2', saludo, 'success');
    setTimeout(function(){ window.location.href = '../ordenar.html'; }, 700);
};

// (Ya no se usa código; se conserva por compatibilidad si algo la llama)
window.verificarCodigo = window.verificarCodigoSMS;

window.volverPaso1 = function() {
    const pc = document.getElementById('paso-codigo');
    const pt = document.getElementById('paso-telefono');
    if (pc) pc.classList.remove('activo');
    if (pt) pt.classList.add('activo');
    var s = document.getElementById('status-2');
    if (s) s.style.display = 'none';
};

/* ── CUENTA CON EMAIL + CONTRASEÑA (Firebase Auth real) ─────── */
window.loginConCuenta = async function() {
    const email = (document.getElementById('login-email').value || '').trim();
    const pass  = document.getElementById('login-pass').value;

    if (!email || !pass) { showStatus('status-login', 'Completa email y contraseña', 'error'); return; }

    showStatus('status-login', 'Entrando...', 'info');
    try {
        const cred = await signInWithEmailAndPassword(auth, email, pass);
        let nombre = cred.user.displayName || email.split('@')[0];
        let telefono = '';
        try {
            const snap = await getDoc(doc(db, 'usuarios', cred.user.uid));
            if (snap.exists()) {
                nombre = snap.data().nombre || nombre;
                telefono = snap.data().telefono || '';
            }
        } catch(e) {}

        guardarSesionCliente(nombre, telefono, cred.user.uid);
        showStatus('status-login', '¡Bienvenido ' + nombre + '!', 'success');
        setTimeout(function(){ window.location.href = '../ordenar.html'; }, 700);
    } catch(e) {
        const msgs = {
            'auth/invalid-credential': 'Email o contraseña incorrectos.',
            'auth/user-not-found': 'No existe una cuenta con ese email.',
            'auth/wrong-password': 'Contraseña incorrecta.',
            'auth/too-many-requests': 'Demasiados intentos. Espera un momento.',
        };
        showStatus('status-login', msgs[e.code] || 'Error al entrar. Intenta de nuevo.', 'error');
    }
};

window.registrarCuenta = async function() {
    const nombre = (document.getElementById('reg-nombre').value || '').trim();
    const telefono = (document.getElementById('reg-telefono').value || '').replace(/[^0-9]/g, '');
    const email = (document.getElementById('reg-email').value || '').trim();
    const pass  = document.getElementById('reg-pass').value;

    if (!nombre) { showStatus('status-registro', 'Escribe tu nombre', 'error'); return; }
    if (!email) { showStatus('status-registro', 'Escribe tu email', 'error'); return; }
    if (pass.length < 8) { showStatus('status-registro', 'La contraseña debe tener mínimo 8 caracteres', 'error'); return; }

    showStatus('status-registro', 'Creando tu cuenta...', 'info');
    try {
        const cred = await createUserWithEmailAndPassword(auth, email, pass);
        try { await updateProfile(cred.user, { displayName: nombre }); } catch(e) {}

        // Privilegios basicos por defecto: rol 'cliente', activo, nunca admin.
        await setDoc(doc(db, 'usuarios', cred.user.uid), {
            nombre: nombre,
            telefono: telefono || '',
            email: email,
            rol: 'cliente',
            activo: true,
            creadoEn: new Date().toISOString(),
        });

        guardarSesionCliente(nombre, telefono, cred.user.uid);
        showStatus('status-registro', '¡Cuenta creada! Bienvenido ' + nombre, 'success');
        setTimeout(function(){ window.location.href = '../ordenar.html'; }, 800);
    } catch(e) {
        const msgs = {
            'auth/email-already-in-use': 'Ya existe una cuenta con ese email. Intenta iniciar sesión.',
            'auth/invalid-email': 'El email no es válido.',
            'auth/weak-password': 'La contraseña es muy débil.',
        };
        showStatus('status-registro', msgs[e.code] || 'Error al crear la cuenta. Intenta de nuevo.', 'error');
    }
};

window.enviarRecuperacion = async function() {
    const email = (document.getElementById('rec-email').value || '').trim();
    if (!email) { showStatus('status-recuperar', 'Escribe tu email', 'error'); return; }

    showStatus('status-recuperar', 'Enviando...', 'info');
    try {
        await sendPasswordResetEmail(auth, email);
        showStatus('status-recuperar', 'Listo, revisa tu correo para el enlace de recuperación.', 'success');
    } catch(e) {
        const msgs = {
            'auth/user-not-found': 'No existe una cuenta con ese email.',
            'auth/invalid-email': 'El email no es válido.',
        };
        showStatus('status-recuperar', msgs[e.code] || 'No se pudo enviar el correo. Intenta de nuevo.', 'error');
    }
};
</script>
</body>
</html>
