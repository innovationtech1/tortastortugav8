<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi Pedido — Tortas Tortuga</title>
<link rel="icon" href="../favicon.ico">
<link rel="stylesheet" href="../css/leaflet/leaflet.css">
<script src="../js/leaflet/leaflet.js"></script>
<script>
// ── ACCESO SOLO CLIENTE CON SESION ────────────────────────────
// Si no hay sesion de cliente (ni de staff, que tiene su propio tablero
// completo en cocina.html), no hay nada que mostrar aqui: al login.
(function() {
    var VEINTE_MIN = 20 * 60 * 1000;
    // sessionStorage NO se comparte entre pestañas — y "Ver mi pedido"
    // se abre en pestaña nueva. Por eso leemos también de localStorage
    // (que sí se comparte) como respaldo.
    function leer(clave) {
        return sessionStorage.getItem(clave) || localStorage.getItem(clave);
    }
    var cliNombre = leer('tt_cliente_nombre');
    var cliTs = parseInt(leer('tt_cliente_ts') || '0');
    var empId = leer('tt_emp_id');
    var empTs = parseInt(leer('tt_emp_ts') || '0');
    var cajNombre = leer('tt_cajero_nombre');
    var cajTs = parseInt(leer('tt_cajero_ts') || '0');

    var hayCliente = cliNombre && (Date.now() - cliTs < VEINTE_MIN);
    var esStaff = (empId && (Date.now() - empTs < VEINTE_MIN)) ||
                  (cajNombre && (Date.now() - cajTs < VEINTE_MIN));

    if (!hayCliente && !esStaff) {
        window.location.replace('bienvenida.html');
    }
    // Si es staff y llega aqui por error, mandarlo a su tablero de verdad
    if (esStaff) {
        window.location.replace('cocina.html');
    }
})();
</script>
<style>
:root {
  --bg:#0D0D0D; --surface:#1A1A1A; --border:rgba(255,255,255,.1); --text:#fff; --muted:#888;
  --orange:#FF5A00; --blue:#3B82F6; --green:#25D366; --yellow:#FBB724; --red:#FF4444;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Inter','Segoe UI',sans-serif;min-height:100vh;}
.header{background:#111;border-bottom:2px solid var(--orange);padding:.9rem 1.1rem;
  display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;}
.logo{font-size:1rem;font-weight:900;color:var(--orange);}
.hbtn{background:rgba(255,255,255,.06);border:1px solid var(--border);color:var(--muted);
  border-radius:8px;padding:.4rem .8rem;font-family:inherit;font-size:.78rem;cursor:pointer;text-decoration:none;}
main{max-width:640px;margin:0 auto;padding:1.2rem 1rem 3rem;}
.aviso{background:rgba(167,139,250,.08);border:1px solid rgba(167,139,250,.3);color:#A78BFA;
  border-radius:12px;padding:.7rem .9rem;font-size:.78rem;margin-bottom:1.1rem;text-align:center;}
.pedido-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;
  padding:1.1rem;margin-bottom:1rem;}
.pedido-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:.6rem;}
.pedido-folio{font-size:1.05rem;font-weight:900;color:var(--orange);}
.pedido-estado{font-size:.72rem;font-weight:800;padding:.3rem .7rem;border-radius:20px;text-transform:uppercase;letter-spacing:.03em;}
.est-nuevo{background:rgba(59,130,246,.15);color:var(--blue);}
.est-cocina{background:rgba(251,183,36,.15);color:var(--yellow);}
.est-listo{background:rgba(37,211,102,.15);color:var(--green);}
.est-camino{background:rgba(59,130,246,.15);color:#3B82F6;}
.est-entregado{background:rgba(255,255,255,.08);color:#999;}
.est-cancelado{background:rgba(255,68,68,.15);color:var(--red);}
.pedido-items{font-size:.85rem;color:#ccc;white-space:pre-line;line-height:1.6;margin-bottom:.6rem;}
.pedido-fecha{font-size:.75rem;color:#888;margin-bottom:.5rem;}
.pedido-total{font-weight:800;font-size:.95rem;text-align:right;color:#fff;}
.vacio{text-align:center;color:#666;font-size:.9rem;padding:3rem 1rem;}
.progreso{display:flex;gap:.3rem;margin:.7rem 0;}
.progreso .paso{flex:1;height:5px;border-radius:3px;background:rgba(255,255,255,.08);}
.progreso .paso.activo{background:var(--orange);}
</style>
</head>
<body>

<div class="header">
    <div class="logo">🐢 Mi Pedido</div>
    <a href="../ordenar.html" class="hbtn">🛒 Ordenar más</a>
</div>

<main>
    <div class="aviso">👁️ Solo puedes ver tus propios pedidos aquí. Esta es una vista de solo lectura.</div>
    <div id="lista-pedidos">
        <div class="vacio">Cargando tus pedidos…</div>
    </div>
</main>

<script type="module">
import { db } from '../js/firebase-config.js';
import { collection, onSnapshot, doc, deleteDoc, addDoc, updateDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

function _leer(clave) {
    return sessionStorage.getItem(clave) || localStorage.getItem(clave);
}
const uid = _leer('tt_cliente_uid') || null;
const telefono = (_leer('tt_cliente_telefono') || '').replace(/\D/g,'');
const miNombre = (_leer('tt_cliente_nombre') || '').trim().toLowerCase();

const ORDEN_ESTADO = ['Nuevo', 'En preparación', 'Listo', 'En camino', 'Entregado'];

function claseEstado(estado) {
    if (!estado) return 'est-nuevo';
    if (estado.includes('Cancelado')) return 'est-cancelado';
    if (estado.includes('Entregado')) return 'est-entregado';
    if (estado.includes('camino')) return 'est-camino';
    if (estado.includes('Listo')) return 'est-listo';
    if (estado.includes('preparaci')) return 'est-cocina';
    return 'est-nuevo';
}

function pasoActual(estado) {
    if (!estado) return 0;
    if (estado.includes('Entregado')) return 4;
    if (estado.includes('camino')) return 3;
    if (estado.includes('Listo')) return 2;
    if (estado.includes('preparaci')) return 1;
    return 0;
}

function esMio(p) {
    // Si el pedido ya fue archivado por el admin (procesado/entregado),
    // deja de mostrarse al cliente en "Mi Pedido".
    if (p.archivado === true) return false;
    // Cuenta con email (uid verificable) — coincidencia confiable.
    if (uid && p.clienteUid && p.clienteUid === uid) return true;
    // Login rapido por telefono — coincidencia por numero (solo de interfaz,
    // no blindada a nivel de servidor; ver nota de seguridad en firestore.rules).
    if (telefono && (p.telefono || '').replace(/\D/g,'') === telefono) return true;
    // Invitado sin telefono — coincidencia por nombre (respaldo para que
    // vea el pedido que acaba de hacer). Igual solo de interfaz.
    if (miNombre && (p.cliente || p.nombre || '').trim().toLowerCase() === miNombre) return true;
    return false;
}

function renderPedidos(pedidos) {
    const cont = document.getElementById('lista-pedidos');
    if (!pedidos.length) {
        cont.innerHTML = '<div class="vacio">Todavía no tienes pedidos. ¡Haz el primero! 🌯</div>';
        return;
    }
    pedidos.sort((a, b) => (b.creado?.seconds || 0) - (a.creado?.seconds || 0));
    cont.innerHTML = pedidos.map(p => {
        const paso = pasoActual(p.estado);
        // Para domicilio el flujo tiene 5 pasos (incluye "En camino").
        // Para pickup son 4 (no hay repartidor en camino).
        const esDomicilio = p.tipo === 'delivery' || p.tipoServicio === 'Domicilio' || p.tipoEntrega === 'Domicilio';
        const totalPasos = esDomicilio ? 5 : 4;
        const pasosArr = [];
        for (let i = 0; i < totalPasos; i++) pasosArr.push(i);
        const pasos = pasosArr.map(i => `<div class="paso ${i <= paso ? 'activo' : ''}"></div>`).join('');
        // Fecha y hora del pedido (desde el timestamp de creación)
        let fechaHora = '';
        const cd = p.creado?.toDate ? p.creado.toDate() : (p.creado?.seconds ? new Date(p.creado.seconds * 1000) : (p.tomadaEn ? new Date(p.tomadaEn) : null));
        if (cd) {
            fechaHora = cd.toLocaleDateString('es-MX', { day: '2-digit', month: 'short', year: 'numeric' }) +
                        ' · ' + cd.toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' });
        }
        const yaCompartio = !!p.ubicacionCliente;
        const btnUbic = `<a href="../ubicacion.html?pedido=${encodeURIComponent(p.id)}"
            style="display:block;margin-top:.7rem;padding:.6rem;text-align:center;text-decoration:none;
            border-radius:10px;font-size:.82rem;font-weight:700;
            background:${yaCompartio ? 'rgba(37,211,102,.12)' : 'rgba(37,211,102,.15)'};
            border:1px solid rgba(37,211,102,.35);color:#25D366;">
            ${yaCompartio ? '✅ Ubicación enviada — tocar para actualizar' : '📍 Enviar mi ubicación'}</a>`;

        // Botón para cancelar el pedido — DESHABILITADO temporalmente
        // (El código se conserva para poder reactivarlo en el futuro)
        const btnCancelar = '';

        return `
        <div class="pedido-card">
            <div class="pedido-top">
                <span class="pedido-folio">${p.folioStr || '#---'}</span>
                <span class="pedido-estado ${claseEstado(p.estado)}">${(p.estado || 'Nuevo').replace(/[^\w\sáéíóúñ]/gi,'').trim()}</span>
            </div>
            ${fechaHora ? `<div class="pedido-fecha">🗓️ ${fechaHora}</div>` : ''}
            <div class="progreso">${pasos}</div>
            <div class="pedido-items">${(p.items || '').replace(/</g,'&lt;')}</div>
            <div class="pedido-total">${p.total || ''}</div>
            ${btnUbic}
            ${btnCancelar}
        </div>`;
    }).join('');
}

onSnapshot(collection(db, 'pedidos'), snap => {
    const todos = [];
    snap.forEach(d => todos.push({ id: d.id, ...d.data() }));
    const mios = todos.filter(esMio);
    window._ultimosPedidos = mios;  // para la cancelación
    renderPedidos(mios);
}, err => {
    document.getElementById('lista-pedidos').innerHTML =
        '<div class="vacio">No se pudieron cargar tus pedidos. Intenta de nuevo más tarde.</div>';
    console.error(err);
});

// ── CANCELACIÓN DE PEDIDO (motivo obligatorio + registro + borrado) ──
let _cancelarPedidoId = null;
let _cancelarPedidoFolio = null;
let _cancelarPedidoData = null;

window.abrirCancelar = function(pedidoId, folio) {
    _cancelarPedidoId = pedidoId;
    _cancelarPedidoFolio = folio || '';
    // Guardar los datos del pedido para el registro (buscar en la última lista)
    _cancelarPedidoData = (window._ultimosPedidos || []).find(function(p){ return p.id === pedidoId; }) || null;
    document.getElementById('cancelar-info').textContent = 'Pedido ' + (folio || '') + ' — esta acción no se puede deshacer.';
    document.getElementById('cancelar-motivo').value = '';
    document.getElementById('cancelar-nota').value = '';
    document.getElementById('cancelar-overlay').style.display = 'flex';
};

window.cerrarCancelar = function() {
    document.getElementById('cancelar-overlay').style.display = 'none';
    _cancelarPedidoId = null;
};

window.confirmarCancelar = async function() {
    if (!_cancelarPedidoId) return;
    const motivo = document.getElementById('cancelar-motivo').value;
    const nota = document.getElementById('cancelar-nota').value.trim();
    if (!motivo) {
        alert('⚠️ Selecciona un motivo de cancelación (es obligatorio).');
        return;
    }
    const p = _cancelarPedidoData || {};
    try {
        // 1. Guardar un registro de cancelación (para auditoría/control)
        await addDoc(collection(db, 'cancelaciones'), {
            pedidoId: _cancelarPedidoId,
            folio: _cancelarPedidoFolio || (p.folioStr || ''),
            cliente: p.cliente || p.nombre || '',
            telefono: p.telefono || '',
            total: p.total || '',
            totalNum: p.totalNum || 0,
            items: p.items || '',
            estadoAlCancelar: p.estado || '',
            motivo: motivo,
            nota: nota || '',
            canceladoPor: 'cliente',
            canceladoEn: new Date().toISOString(),
            creadoServidor: serverTimestamp()
        });

        // 2. Borrar el pedido del sistema (desaparece de cocina, admin y del
        //    perfil del cliente). El registro queda en "cancelaciones".
        //    Nota: la regla de Firestore solo permite borrar si archivado==true,
        //    así que primero lo marcamos archivado+cancelado y luego lo borramos.
        try {
            await updateDoc(doc(db, 'pedidos', _cancelarPedidoId), {
                estado: 'Cancelado ❌', archivado: true,
                canceladoMotivo: motivo, canceladoEn: new Date().toISOString()
            });
        } catch(e) { /* si no se puede actualizar, intentamos borrar directo */ }
        await deleteDoc(doc(db, 'pedidos', _cancelarPedidoId));

        window.cerrarCancelar();
        if (window.ttAlert) window.ttAlert('✅ Pedido cancelado. Motivo: ' + motivo);
        else alert('✅ Pedido cancelado.');
    } catch(e) {
        console.error('Error al cancelar:', e);
        alert('❌ No se pudo cancelar el pedido. Revisa tu conexión.');
    }
};
</script>

<script src="../js/tt-alert.js"></script>
<script src="../js/perfil-barra.js?v=1787287932"></script>
<!-- Modal de cancelación de pedido -->
<div id="cancelar-overlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:9999;align-items:center;justify-content:center;padding:1rem;">
  <div style="background:#1A1A1A;border:1px solid rgba(239,68,68,.3);border-radius:16px;padding:1.4rem;width:100%;max-width:400px;">
    <h3 style="margin:0 0 .3rem;font-size:1.1rem;color:#EF4444;">❌ Cancelar pedido</h3>
    <div id="cancelar-info" style="font-size:.85rem;color:#888;margin-bottom:1rem;">—</div>
    <p style="font-size:.8rem;color:#ccc;font-weight:700;margin:0 0 .5rem;">Motivo de cancelación (obligatorio):</p>
    <select id="cancelar-motivo" style="width:100%;padding:.7rem;border-radius:10px;border:1px solid rgba(255,255,255,.2);background:#111;color:#fff;font-family:inherit;font-size:.9rem;margin-bottom:.6rem;">
      <option value="">— Selecciona un motivo —</option>
      <option>Ya no lo quiero</option>
      <option>Me equivoqué en el pedido</option>
      <option>Tardó demasiado</option>
      <option>Pedí por error</option>
      <option>Cambié de opinión</option>
      <option>Problema con el pago</option>
      <option>Otro</option>
    </select>
    <input id="cancelar-nota" type="text" placeholder="Detalle (opcional)" style="width:100%;padding:.7rem;border-radius:10px;border:1px solid rgba(255,255,255,.2);background:#111;color:#fff;font-family:inherit;font-size:.85rem;margin-bottom:1rem;box-sizing:border-box;">
    <div style="display:flex;gap:.5rem;">
      <button onclick="cerrarCancelar()" style="flex:1;padding:.8rem;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:10px;font-family:inherit;font-weight:700;cursor:pointer;">Volver</button>
      <button onclick="confirmarCancelar()" style="flex:1;padding:.8rem;background:linear-gradient(135deg,#EF4444,#DC2626);border:none;color:#fff;border-radius:10px;font-family:inherit;font-weight:800;cursor:pointer;">Cancelar pedido</button>
    </div>
  </div>
</div>
</body>
</html>
