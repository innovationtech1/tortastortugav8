  .mp-stats { display:flex; gap:.6rem; padding:1rem; }
  .mp-stat { flex:1; background:var(--surface); border-radius:12px; padding:.8rem; text-align:center; }
  .mp-stat .n { font-size:1.5rem; font-weight:900; }

  .mp-hora { font-size:.72rem; color:var(--muted); }
  .mp-cliente { font-size:1rem; font-weight:700; margin-top:.2rem; }
  .mp-badge { font-size:.68rem; font-weight:700; padding:2px 10px; border-radius:20px; display:inline-block; margin-top:.3rem; }
  .mp-items { font-size:.82rem; color:#ccc; margin:.5rem 0; line-height:1.5; }
  .mp-total { font-size:1.1rem; font-weight:800; color:var(--green); }
  .mp-estado { font-size:.75rem; font-weight:700; padding:3px 10px; border-radius:20px; }
  .est-nuevo { background:rgba(255,90,0,.15); color:#FF5A00; }
  .est-prep { background:rgba(251,191,36,.15); color:#FBB724; }
  .est-listo { background:rgba(37,211,102,.15); color:var(--green); }
  .est-entregado { background:rgba(136,136,136,.15); color:var(--muted); }
  .mp-acciones { display:flex; gap:.5rem; margin-top:.8rem; flex-wrap:wrap; }
  .mp-btn { flex:1; min-width:120px; padding:.7rem; border:none; border-radius:10px; font-family:inherit; font-size:.85rem; font-weight:700; cursor:pointer; }
  .mp-btn-prep { background:rgba(251,191,36,.2); border:1px solid rgba(251,191,36,.5); color:#FBB724; }
  .mp-btn-listo { background:rgba(37,211,102,.2); border:1px solid rgba(37,211,102,.5); color:var(--green); }
  .mp-btn-cobrar { background:linear-gradient(135deg,#25D366,#1DA851); color:#fff; }
  .mp-btn-pagado { background:rgba(136,136,136,.15); color:var(--muted); border:1px solid rgba(255,255,255,.1); }
  .mp-vacio { text-align:center; padding:3rem 1rem; color:var(--muted); }
  .mp-vacio .ico { font-size:3rem; margin-bottom:.5rem; }
  /* Modal de cobro */
  .cobro-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.8); z-index:1000; align-items:center; justify-content:center; padding:1rem; }
  .cobro-box { background:var(--surface); border-radius:16px; padding:1.4rem; width:100%; max-width:380px; }
  .cobro-box h3 { margin:0 0 .3rem; font-size:1.1rem; }
  .cobro-metodos { display:grid; grid-template-columns:1fr 1fr; gap:.6rem; margin:1rem 0; }
  .cobro-metodo { padding:.9rem; border-radius:12px; border:1px solid rgba(255,255,255,.15); background:rgba(255,255,255,.04); color:#fff; font-family:inherit; font-size:.9rem; font-weight:700; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:.3rem; }
  .cobro-metodo:active { transform:scale(.96); }

<script type="module">
import { db } from '../js/firebase-config.js';
import { collection, onSnapshot, doc, updateDoc, getDocs } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

function leer(k){ return localStorage.getItem(k) || sessionStorage.getItem(k); }
const miId     = (leer('tt_emp_id') || leer('tt_cajero_id') || '').trim();
const miNombre = (leer('tt_emp_nombre') || leer('tt_cajero_nombre') || miId).trim();

document.getElementById('mp-nombre').textContent = miNombre + (miId ? (' · ' + miId) : '');

let _pedidos = [];
let _cobroId = null;

function esMio(p) {
    // Pedidos tomados por este empleado (por id o por nombre de cajero)
    return (p.cajeroId && p.cajeroId === miId) ||
           (p.cajeroNombre && p.cajeroNombre === miNombre) ||
           (p.tortumovilId && p.tortumovilId === miId);
}

function hoyInicio() {
    const h = new Date(); h.setHours(0,0,0,0); return h.getTime();
}

function parseItems(p) {
    if (Array.isArray(p.itemsData) && p.itemsData.length) {
        var grupos = window.agruparItems ? window.agruparItems(p.itemsData) : p.itemsData.map(function(i){ i.cantidad=i.cantidad||1; return i; });
        return grupos.map(function(g){
            return g.cantidad + '× ' + (g.nombre||'Producto') + (g.variante ? ' ('+g.variante+')' : '');
        });
    }
    if (typeof p.items === 'string') return p.items.split(' | ').filter(Boolean);
    return [];
}

function claseEstado(est) {
    est = est || '';
    if (est.includes('Entregado')) return 'est-entregado';
    if (est.includes('Listo')) return 'est-listo';
    if (est.includes('preparación')) return 'est-prep';
    return 'est-nuevo';
}

function render() {
    const cont = document.getElementById('mp-lista');
    const inicio = hoyInicio();
    // Solo mis pedidos de hoy
    const mios = _pedidos.filter(p => {
        if (!esMio(p)) return false;
        const ts = p.creado?.seconds ? p.creado.seconds*1000 : 0;
        return ts >= inicio && !p.archivado;
    });

    // Estadísticas
    document.getElementById('mp-total-count').textContent = mios.length;
    const porCobrar = mios.filter(p => p.estadoPago !== 'Pagado');
    document.getElementById('mp-pend-count').textContent = porCobrar.length;
    let cobrado = 0;
    mios.forEach(p => { if (p.estadoPago === 'Pagado') cobrado += (p.totalNum || 0); });
    document.getElementById('mp-cobrado').textContent = '$' + cobrado.toFixed(0);

    if (!mios.length) {
        cont.innerHTML = '<div class="mp-vacio"><div class="ico">🧾</div><div>Aún no has tomado pedidos hoy.</div><div style="font-size:.8rem;margin-top:.5rem;">Toca "+ Nueva" para crear uno.</div></div>';
        return;
    }

    cont.innerHTML = mios.map(p => {
        const folio = p.folioStr || ('#' + (p.id||'').slice(-4).toUpperCase());
        const hora = p.creado?.seconds ? new Date(p.creado.seconds*1000).toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'}) : '';
        const items = parseItems(p);
        const estado = p.estado || 'Nuevo';
        const pagado = p.estadoPago === 'Pagado';
        const esTortu = p.ordenoEnTortumovil;

        // Botones de preparación según estado
        let btnPrep = '';
        if (estado.includes('Nuevo')) {
            btnPrep = `<button class="mp-btn mp-btn-prep" onclick="cambiarEstado('${p.id}','En preparación 🧑‍🍳')">🍳 Preparar</button>`;
        } else if (estado.includes('preparación')) {
            btnPrep = `<button class="mp-btn mp-btn-listo" onclick="cambiarEstado('${p.id}','Listo ✅')">✅ Lista</button>`;
        }

        // Botón pedir ubicación al cliente por SMS
        const _tel = (p.telefono || p.cliente_telefono || p.telefonoCliente || '').toString().replace(/'/g,'');
        const _nomCli = (p.cliente || p.nombre || '').toString().replace(/'/g,'');
        const _tieneUbi = (p.ubicacionCliente && p.ubicacionCliente.lat) || (p.ubicacion && p.ubicacion.lat);
        let btnUbicacion = _tieneUbi
            ? `<button class="mp-btn" style="background:rgba(37,211,102,.15);border:1px solid rgba(37,211,102,.4);color:#25D366;" onclick="verUbicacionCliente('${p.id}')">🗺️ Ver ubicación en vivo</button>`
            : `<button class="mp-btn" style="background:rgba(255,90,0,.15);border:1px solid rgba(255,90,0,.4);color:#FF7A33;" onclick="pedirUbicacionCliente('${p.id}','${_tel}','${_nomCli}')">📍 Pedir ubicación</button>`;

        // Etiqueta informativa del repartidor asignado (la asignación se hace en Mis Rutas)
        let btnRepartidor = p.repartidorNombre
            ? `<div class="mp-btn" style="background:rgba(37,211,102,.08);border:1px solid rgba(37,211,102,.3);color:#25D366;cursor:default;">🛵 Reparte: ${p.repartidorNombre}</div>`
            : `<div class="mp-btn" style="background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);color:#888;cursor:default;">🛵 Sin repartidor asignado</div>`;

        // Botón de cobro
        let btnCobro = pagado
            ? `<button class="mp-btn mp-btn-pagado" disabled>✅ Pagado (${p.metodoPagoReal||''})</button>`
            : `<button class="mp-btn mp-btn-cobrar" onclick="abrirCobro('${p.id}')">💵 Cobrar ${p.total||''}</button>`;

        return `<div class="mp-card">
            <div class="mp-card-top">
                <div>
                    <div class="mp-folio">${folio} <span class="mp-hora">${hora}</span></div>
                    <div class="mp-cliente">${p.cliente || 'Cliente'}</div>
                        ${(p.cajeroNombre || p.tortumovilNombre) ? `<div style="font-size:.72rem;color:#888;margin-top:2px;">📝 Tomó: ${p.cajeroNombre || p.tortumovilNombre}</div>` : ''}
                    ${esTortu ? '<span class="mp-badge" style="background:rgba(37,211,102,.15);color:#25D366;">🚐 Tortumóvil</span>' : ''}
                </div>
                <span class="mp-estado ${claseEstado(estado)}">${estado}</span>
            </div>
            <div class="mp-items">${items.join('<br>')}</div>
            <div class="mp-total">${p.total || ''}</div>
            <div class="mp-acciones">
                ${btnPrep}
                ${btnCobro}
                ${btnRepartidor}
                ${btnUbicacion}
                ${_tel ? `<button class="mp-btn" style="background:rgba(37,211,102,.15);border:1px solid rgba(37,211,102,.4);color:#25D366;" onclick="enviarTicketWA('${p.id}')">📱 Enviar ticket WhatsApp</button>` : ''}
            </div>
        </div>`;
    }).join('');
}

// ── Enviar ticket por WhatsApp ──
window.enviarTicketWA = function(pedidoId) {
    var p = (window._pedidos || _pedidos || []).find(function(x){ return x.id === pedidoId; });
    if (!p) { alert('No se encontró el pedido.'); return; }
    var tel = String(p.telefono || p.cliente_telefono || p.telefonoCliente || '').replace(/[^0-9]/g,'');
    if (!tel) { alert('Este pedido no tiene teléfono del cliente.'); return; }
    if (tel.length === 10) tel = '1' + tel;  // código de país USA por defecto

    var msg = _armarTicketWA(p);
    var url = 'https://wa.me/' + tel + '?text=' + encodeURIComponent(msg);
    window.open(url, '_blank');
};

// Armar el texto del ticket para WhatsApp
window._armarTicketWA = function(p) {
    var L = [];
    L.push('🐢 *TORTAS TORTUGA*');
    L.push('━━━━━━━━━━━━━');
    L.push('Pedido ' + (p.folioStr || ('#'+(p.folio||''))));
    if (p.cliente || p.nombre) L.push('Cliente: ' + (p.cliente || p.nombre));
    L.push('');
    L.push('🛍️ *Tu orden:*');
    var items = p.itemsData;
    if (Array.isArray(items) && items.length) {
        var grupos = window.agruparItems ? window.agruparItems(items) : items.map(function(i){ i.cantidad=i.cantidad||1; return i; });
        grupos.forEach(function(g){
            L.push('• ' + g.cantidad + '× ' + g.nombre + (g.variante ? ' ('+g.variante+')' : '') + (g.precio ? ' — $' + g.precio.toFixed(2) : ''));
        });
    } else if (typeof p.items === 'string' && p.items.indexOf('Pendiente') < 0) {
        L.push('• ' + p.items);
    } else {
        L.push('• (Orden por definir)');
    }
    L.push('');
    L.push('━━━━━━━━━━━━━');
    if (p.cargoServicio) L.push('🛵 Envío: $' + Number(p.cargoServicio).toFixed(2));
    L.push('💵 *Total: ' + (p.total || '$0.00') + '*');
    L.push(p.estadoPago === 'Pagado' ? '✅ Pagado' : '⏳ Por pagar');
    L.push('');
    L.push('¡Gracias por tu compra! 🐢');
    return L.join('\n');
};

window.cambiarEstado = async function(id, estado) {
    try {
        const updates = { estado };
        if (estado.includes('preparación')) updates['tiempos.enCocina'] = Date.now();
        else if (estado.includes('Listo')) updates['tiempos.lista'] = Date.now();
        await updateDoc(doc(db, 'pedidos', id), updates);
        if (window.ttAlert) window.ttAlert('Estado actualizado.');
    } catch(e) { alert('Error al cambiar estado.'); }
};

window.abrirCobro = function(id) {
    _cobroId = id;
    const p = _pedidos.find(x => x.id === id);
    if (!p) return;
    document.getElementById('cobro-info').textContent = (p.cliente||'Cliente') + ' · ' + (p.folioStr||'');
    document.getElementById('cobro-total').textContent = p.total || '$0';
    document.getElementById('cobro-overlay').style.display = 'flex';
};

window.cerrarCobro = function() {
    document.getElementById('cobro-overlay').style.display = 'none';
    _cobroId = null;
};

window.confirmarCobro = async function(metodo) {
    if (!_cobroId) return;
    try {
        await updateDoc(doc(db, 'pedidos', _cobroId), {
            estadoPago: 'Pagado',
            metodoPagoReal: metodo,
            cobradoPor: miNombre || miId,
            cobradoEn: new Date().toISOString()
        });
        if (window.ttAlert) window.ttAlert('✅ Cobrado con ' + metodo);
        cerrarCobro();
    } catch(e) { alert('Error al cobrar.'); }
};

// Escuchar pedidos en vivo
onSnapshot(collection(db, 'pedidos'), snap => {
    _pedidos = [];
    snap.forEach(d => _pedidos.push({ id: d.id, ...d.data() }));
    window._pedidosMP = _pedidos;
    render();
}, err => {
    document.getElementById('mp-lista').innerHTML = '<div class="mp-vacio"><div class="ico">⚠️</div><div>Error al cargar. Revisa tu conexión.</div></div>';
});
</script>


<script>
// ── PEDIR UBICACIÓN AL CLIENTE (SMS) — igual que en Mis Rutas ──
window.pedirUbicacionCliente = function(pedidoId, telefono, nombre) {
    var base = window.location.origin + window.location.pathname.replace(/pages\/mis-pedidos\.html$/, '');
    var link = base + 'ubicacion.html?pedido=' + pedidoId;

    var saludo = nombre ? ('Hola ' + nombre + '!') : 'Hola!';
    var mensaje =
        saludo + ' Somos Tortas Tortuga \uD83D\uDC22\n\n' +
        'Para entregarte tu pedido necesitamos tu ubicacion exacta.\n\n' +
        'Solo abre este link y toca "Compartir mi ubicacion":\n' + link;

    var num = String(telefono || '').replace(/[^0-9]/g, '');

    if (num) {
        if (num.length === 10) num = '1' + num;
        var smsUrl = 'sms:+' + num + '?body=' + encodeURIComponent(mensaje);
        window.open(smsUrl, '_blank');
    } else {
        if (navigator.clipboard) {
            navigator.clipboard.writeText(link).then(function(){
                mostrarToastMP('📋 Link copiado. Compártelo con el cliente.');
            }).catch(function(){
                prompt('Copia este link y mándalo al cliente:', link);
            });
        } else {
            prompt('Copia este link y mándalo al cliente:', link);
        }
    }
};

function mostrarToastMP(txt) {
    var toast = document.createElement('div');
    toast.textContent = txt;
    toast.style.cssText = 'position:fixed;bottom:80px;left:50%;transform:translateX(-50%);' +
        'background:#25D366;color:#fff;padding:.7rem 1.3rem;border-radius:20px;font-weight:700;' +
        'z-index:99999;box-shadow:0 4px 16px rgba(0,0,0,.4);font-family:system-ui,sans-serif;max-width:90%;text-align:center;';
    document.body.appendChild(toast);
    setTimeout(function(){ toast.remove(); }, 2500);
}
</script>

<script type="module">
import { db } from '../js/firebase-config.js';
import { collection, doc, updateDoc, getDocs } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

let _repPedidoId = null;

window.abrirAsignarRepartidor = async function(id, ticket) {
    _repPedidoId = id;
    document.getElementById('rep-ticket').textContent = '#' + String(ticket).replace(/^#+/,'');
    document.getElementById('rep-modal').style.display = 'flex';
    var lista = document.getElementById('rep-lista');
    var quitarBtn = document.getElementById('rep-quitar-btn');
    lista.innerHTML = '<div style="color:#888;font-size:.82rem;text-align:center;padding:1rem;">Cargando repartidores…</div>';

    var pedido = (window._pedidosMP || []).find(function(p){ return String(p.id) === String(id); });
    quitarBtn.style.display = (pedido && pedido.repartidorId) ? 'block' : 'none';

    try {
        var snap = await getDocs(collection(db, 'empleados'));
        var empleados = [];
        snap.forEach(function(d){ var e = d.data(); e._docId = d.id; empleados.push(e); });
        if (!empleados.length) {
            lista.innerHTML = '<div style="color:#888;font-size:.82rem;text-align:center;padding:1rem;">No hay empleados registrados.</div>';
            return;
        }
        var asignadoId = pedido ? pedido.repartidorId : null;
        lista.innerHTML = empleados.map(function(e){
            var eid = e.empleadoId || e.id || e._docId;
            var nombre = e.nombre || eid;
            var rol = e.rol || 'empleado';
            var activo = String(asignadoId) === String(eid);
            return '<button onclick="asignarRepartidor(\'' + eid + '\',\'' + String(nombre).replace(/'/g,"") + '\')" ' +
                'style="display:flex;align-items:center;justify-content:space-between;width:100%;padding:.7rem .9rem;' +
                'background:' + (activo ? 'rgba(37,211,102,.2)' : 'rgba(255,255,255,.04)') + ';' +
                'border:1.5px solid ' + (activo ? 'rgba(37,211,102,.5)' : 'rgba(255,255,255,.1)') + ';' +
                'border-radius:10px;color:#fff;font-family:inherit;font-size:.85rem;font-weight:700;cursor:pointer;">' +
                '<span>' + nombre + '</span>' +
                '<span style="font-size:.68rem;color:#888;text-transform:capitalize;">' + rol + (activo ? ' ✓' : '') + '</span>' +
                '</button>';
        }).join('');
    } catch(err) {
        lista.innerHTML = '<div style="color:#F44336;font-size:.82rem;text-align:center;padding:1rem;">Error cargando repartidores.</div>';
    }
};

window.asignarRepartidor = async function(repId, repNombre) {
    if (!_repPedidoId) return;
    try {
        await updateDoc(doc(db, 'pedidos', _repPedidoId), {
            repartidorId: String(repId),
            repartidorNombre: repNombre,
            repartidorAsignadoEn: new Date().toISOString()
        });
        document.getElementById('rep-modal').style.display = 'none';
    } catch(err) {
        alert('Error asignando repartidor.');
    }
};

window.quitarRepartidor = async function() {
    if (!_repPedidoId) return;
    try {
        await updateDoc(doc(db, 'pedidos', _repPedidoId), {
            repartidorId: null,
            repartidorNombre: null
        });
        document.getElementById('rep-modal').style.display = 'none';
    } catch(err) {
        alert('Error quitando repartidor.');
    }
};
</script>
<script type="module" src="../js/contador-disponibles.js?v=1787291222"></script>

<!-- Modal mapa ubicación cliente (tiempo real) -->
<div id="mapa-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:99999;flex-direction:column;padding:1rem;">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:.7rem;">
    <div id="mapa-titulo" style="font-size:1rem;font-weight:800;color:#fff;">📍 Ubicación del cliente</div>
    <button onclick="cerrarMapaCliente()" style="background:rgba(255,255,255,.15);border:none;color:#fff;border-radius:10px;width:40px;height:40px;font-size:1.3rem;cursor:pointer;">✕</button>
  </div>
  <div id="mapa-cliente" style="flex:1;border-radius:14px;overflow:hidden;min-height:300px;"></div>
  <div id="mapa-eta" style="margin-top:.7rem;padding:.8rem;background:rgba(255,255,255,.05);border-radius:12px;border:1px solid rgba(255,255,255,.1);"></div>
  <div id="mapa-info" style="margin-top:.6rem;text-align:center;color:#aaa;font-size:.8rem;"></div>
</div>

<script type="module">
import { db } from '../js/firebase-config.js';
import { doc, onSnapshot } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

let _mapaCli = null;
let _markerCli = null;
let _markerRep = null;
let _unsubMapa = null;
let _watchRepId = null;
let _miPosMapa = null;

// Distancia en km entre dos puntos (haversine)
function _distKm(lat1, lng1, lat2, lng2) {
    const R = 6371;
    const dLat = (lat2-lat1) * Math.PI/180;
    const dLng = (lng2-lng1) * Math.PI/180;
    const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

// Estimar tiempo de llegada (velocidad promedio de ciudad: 30 km/h)
function _estimarETA(distKm) {
    const VELOCIDAD_KMH = 30;
    const minutos = Math.round((distKm / VELOCIDAD_KMH) * 60);
    if (minutos < 1) return 'menos de 1 min';
    if (minutos === 1) return '~1 min';
    if (minutos < 60) return '~' + minutos + ' min';
    const h = Math.floor(minutos/60), m = minutos % 60;
    return '~' + h + 'h ' + m + 'min';
}

let _ultimaPosCliente = null;
function _actualizarETA() {
    const etaEl = document.getElementById('mapa-eta');
    if (!etaEl) return;
    if (!_miPosMapa || !_ultimaPosCliente) {
        etaEl.innerHTML = '<span style="color:#888;">Activa tu GPS para ver el tiempo de llegada</span>';
        return;
    }
    const km = _distKm(_miPosMapa.lat, _miPosMapa.lng, _ultimaPosCliente.lat, _ultimaPosCliente.lng);
    const millas = (km * 0.621371).toFixed(1);
    const eta = _estimarETA(km);
    etaEl.innerHTML =
        '<div style="display:flex;justify-content:space-around;align-items:center;">' +
        '<div style="text-align:center;"><div style="font-size:1.5rem;font-weight:900;color:#FF7A33;">' + millas + '</div><div style="font-size:.7rem;color:#888;">millas</div></div>' +
        '<div style="text-align:center;"><div style="font-size:1.5rem;font-weight:900;color:#25D366;">' + eta + '</div><div style="font-size:.7rem;color:#888;">tiempo estimado</div></div>' +
        '</div>';

    // Dibujar/actualizar el pin del repartidor en el mapa
    if (_mapaCli) {
        if (!_markerRep) {
            const iconRep = L.divIcon({ html: '🛵', className: '', iconSize: [30,30], iconAnchor: [15,15] });
            _markerRep = L.marker([_miPosMapa.lat, _miPosMapa.lng], { icon: iconRep }).addTo(_mapaCli).bindPopup('Tú (repartidor)');
        } else {
            _markerRep.setLatLng([_miPosMapa.lat, _miPosMapa.lng]);
        }
    }
}

function _iniciarGPSRepartidor() {
    if (_watchRepId !== null || !navigator.geolocation) return;
    _watchRepId = navigator.geolocation.watchPosition(function(pos) {
        _miPosMapa = { lat: pos.coords.latitude, lng: pos.coords.longitude };
        _actualizarETA();
    }, function(){}, { enableHighAccuracy: true, maximumAge: 5000 });
}

window.verUbicacionCliente = function(pedidoId) {
    const modal = document.getElementById('mapa-modal');
    modal.style.display = 'flex';
    document.getElementById('mapa-info').textContent = 'Cargando ubicación…';
    _iniciarGPSRepartidor(); // arrancar GPS del repartidor para el ETA

    // Limpiar mapa anterior
    if (_mapaCli) { _mapaCli.remove(); _mapaCli = null; _markerCli = null; }

    // Escuchar el pedido en TIEMPO REAL (si el cliente actualiza su GPS, se mueve el pin)
    if (_unsubMapa) _unsubMapa();
    _unsubMapa = onSnapshot(doc(db, 'pedidos', pedidoId), function(snap) {
        if (!snap.exists()) return;
        const p = snap.data();
        const u = p.ubicacionCliente || p.ubicacion || {};
        const lat = u.lat, lng = u.lng;
        const nombre = p.cliente || p.nombre || 'Cliente';
        const dir = u.direccion || p.referenciaCliente || '';

        document.getElementById('mapa-titulo').textContent = '📍 ' + nombre;

        if (!lat || !lng) {
            document.getElementById('mapa-info').textContent = 'El cliente aún no comparte su ubicación.';
            return;
        }

        if (!_mapaCli) {
            _mapaCli = L.map('mapa-cliente').setView([lat, lng], 16);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap', maxZoom: 19
            }).addTo(_mapaCli);
            _markerCli = L.marker([lat, lng]).addTo(_mapaCli)
                .bindPopup('<b>' + nombre + '</b>' + (dir ? '<br>' + dir : '')).openPopup();
            setTimeout(function(){ if(_mapaCli) _mapaCli.invalidateSize(); }, 200);
        } else {
            // Actualizar posición en vivo
            _markerCli.setLatLng([lat, lng]);
            _mapaCli.panTo([lat, lng]);
        }

        // Guardar posición del cliente y recalcular ETA
        _ultimaPosCliente = { lat: lat, lng: lng };
        _actualizarETA();

        const hora = u.compartidaEn ? new Date(u.compartidaEn).toLocaleTimeString() : '';
        document.getElementById('mapa-info').innerHTML =
            '✅ Ubicación en vivo' + (hora ? ' · actualizada ' + hora : '') +
            (dir ? '<br>' + dir : '') +
            '<br><a href="https://www.google.com/maps?q=' + lat + ',' + lng + '" target="_blank" style="color:#5B9BFF;">Abrir en Google Maps</a>';
    });
};

window.cerrarMapaCliente = function() {
    document.getElementById('mapa-modal').style.display = 'none';
    if (_unsubMapa) { _unsubMapa(); _unsubMapa = null; }
    if (_mapaCli) { _mapaCli.remove(); _mapaCli = null; _markerCli = null; _markerRep = null; }
    if (_watchRepId !== null) { navigator.geolocation.clearWatch(_watchRepId); _watchRepId = null; }
    _ultimaPosCliente = null;
};
</script>
</body>
